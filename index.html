document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

 46px; height: 42px; border-radius: 10px; border: 2px solid #e2e8f0; background: #fff; color: #cbd5e1; font-size: 18px; font-weight: 800; display: flex; align-items: center; justify-content: center; }\n  .ct-check.done { background: #10b981; border-color: #10b981; color: #fff; }\n  .ct-ex-wrap { position: relative; }\n  .ct-drag { flex-shrink: 0; width: 30px; height: 34px; display: flex; align-items: center; justify-content: center; margin-right: 2px; margin-left: -4px; color: #cbd5e1; font-size: 17px; line-height: 1; cursor: grab; touch-action: none; border-radius: 8px; background: #f8fafc; border: 1px solid #f1f5f9; }\n  .ct-drag:active { cursor: grabbing; background: #e2e8f0; color: #64748b; }\n  .ct-ex-wrap.dragging { z-index: 60; }\n  .ct-rest { position: fixed; left: 50%; transform: translateX(-50%); bottom: 0; width: 100%; max-width: 600px; z-index: 200; padding: 0 12px calc(12px + env(safe-area-inset-bottom)); display: none; }\n  .ct-rest.show { display: block; }\n  .ct-rest-inner { background: #0f172a; color: #fff; border-radius: 16px; padding: 12px 14px; display: flex; align-items: center; gap: 12px; box-shadow: 0 10px 30px rgba(15,23,42,.3); }\n  .ct-rest-ring { width: 46px; height: 46px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: conic-gradient(#34d399 0%, #334155 0); }\n  .ct-rest-ring-in { width: 36px; height: 36px; border-radius: 50%; background: #0f172a; display: flex; align-items: center; justify-content: center; font-size: 14px; }\n  .ct-rest-btn { border-radius: 10px; padding: 10px 13px; font-size: 12px; font-weight: 700; }\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n<div class=\"app\">\n  <header class=\"hdr\">\n    <div class=\"eyebrow\">Plano de Saúde Completo<\u002Fdiv>\n    <h1>Wesley Lima da Silva<\u002Fh1>\n    <div class=\"meta\">\n      <span>28 anos<\u002Fspan><span>·<\u002Fspan>\n      <span>1,66 m · 93,5 kg<\u002Fspan><span>·<\u002Fspan>\n      <span class=\"imc\">IMC 33,9<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fheader>\n  <nav class=\"tabs\"><div class=\"tabs-inner\" id=\"tabs\"><\u002Fdiv><\u002Fnav>\n  <main class=\"content\" id=\"content\"><\u002Fmain>\n<\u002Fdiv>\n<div class=\"install-hint\" id=\"installHint\">📲 Toque \"Compartilhar\" → \"Adicionar à Tela de Início\"<\u002Fdiv>\n<div class=\"ct-rest\" id=\"ctRestBar\">\n  <div class=\"ct-rest-inner\">\n    <div class=\"ct-rest-ring\" id=\"ctRestRing\"><div class=\"ct-rest-ring-in\">⏱<\u002Fdiv><\u002Fdiv>\n    <div style=\"flex:1;min-width:0\">\n      <div style=\"font-size:10px;color:#94a3b8;text-transform:uppercase;letter-spacing:1px\">Descanso<\u002Fdiv>\n      <div id=\"ctRestTime\" style=\"font-size:24px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums\">0:00<\u002Fdiv>\n    <\u002Fdiv>\n    <button class=\"ct-rest-btn\" onclick=\"ctAddRest()\" style=\"background:#1e293b;color:#fff\">+15s<\u002Fbutton>\n    <button class=\"ct-rest-btn\" onclick=\"ctSkipRest()\" style=\"background:#34d399;color:#053a2a\">Pular<\u002Fbutton>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<script>\n'use strict';\n\n// ─── State + storage ────────────────────────────────────────────────\n// Salvamento real no aparelho (localStorage) com fallback em memória\nconst STORE_KEY = 'plano_wesley_v1';\nlet MEM = {};\ntry { MEM = JSON.parse(localStorage.getItem(STORE_KEY) || '{}') || {}; } catch(e) { MEM = {}; }\nfunction persistStore() { try { localStorage.setItem(STORE_KEY, JSON.stringify(MEM)); } catch(e) {} }\nfunction load(k, def) { return Object.prototype.hasOwnProperty.call(MEM, k) ? MEM[k] : def; }\nfunction save(k, v) { MEM[k] = String(v); persistStore(); }\nconst STATE = {\n  tab: load('tab', 'diet'),\n  dayType: load('dayType', 'treino'),\n  week: parseInt(load('week', '1'), 10) || 1,\n  session: load('session', 'fullA'),\n};\nfunction set(k, v) { STATE[k] = v; save(k, v); render(); }\n\n// ─── Helpers ────────────────────────────────────────────────────────\nconst h = (s) => s == null ? '' : String(s).replace(/[&<>\"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]));\nconst card = (inner) => `<div class=\"card\">${inner}<\u002Fdiv>`;\nconst sectionTitle = (ico, title, sub) => `<div class=\"section-title\"><div class=\"ico\">${ico}<\u002Fdiv><h2>${h(title)}<\u002Fh2><div class=\"sub\">${h(sub)}<\u002Fdiv><\u002Fdiv>`;\nconst tag = (label, color) => `<span class=\"tag ${color}\">${h(label)}<\u002Fspan>`;\nconst row = (lbl, val, accent, sub) => `<div class=\"row\"><span class=\"lbl\">${h(lbl)}<\u002Fspan><div class=\"val ${accent ? 'accent-'+accent : ''}\">${h(val)}${sub ? `<div class=\"sub\">${h(sub)}<\u002Fdiv>` : ''}<\u002Fdiv><\u002Fdiv>`;\n\nconst TABS = [\n  { id: 'diet', em: '🥗', label: 'Dieta' },\n  { id: 'training', em: '💪', label: 'Treino' },\n  { id: 'exec', em: '🏋️', label: 'Execução' },\n  { id: 'supps', em: '💊', label: 'Suplementos' },\n  { id: 'protocolos', em: '🩺', label: 'Protocolos' },\n  { id: 'history', em: '📈', label: 'Histórico' },\n];\n\n// ─── TAB · DIETA ──────────────────────────────────────────────────\nfunction renderDiet() {\n  const t = STATE.dayType;\n  const macros = t === 'treino'\n    ? { kcal: '~2.200 kcal', p:'140g', c:'240g', g:'75g', pc:'25%', cc:'44%', gc:'31%' }\n    : { kcal: '~2.000 kcal', p:'140g', c:'190g', g:'75g', pc:'28%', cc:'38%', gc:'34%' };\n\n  const meals = [\n    {\n      hora: '12:30', nome: 'Almoço', kcal: t==='treino'?'~880 kcal':'~805 kcal',\n      items: [\n        { t:'Proteína magra grelhada — 200 g (≈ 260 g cru)', k:330 },\n        t==='treino' ? { t:'Arroz integral cozido — 225 g (7–8 col. sopa cheias) (≈ 75 g cru)', k:250 } : { t:'Arroz integral cozido — 160 g (5 col. sopa cheias) (≈ 55 g cru)', k:175 },\n        { t:'Feijão cozido — 140 g (1 concha média) (≈ 50 g cru)', k:110 },\n        { t:'Legumes refogados — 150 g (≈ 190 g crus)', k:90 },\n        { t:'Salada de tomate e pimentão — 100 g', k:20 },\n        { t:'Azeite de oliva — 1 col. sopa', k:80 }],\n      sup: '💊 Berberina 500mg (30min antes) · Enzimas (início) · Cromo 200mcg · D3 4.000UI+K2 100mcg · Ômega 3 (2g EPA+DHA) · Cúrcuma 500mg+piperina · Vit. C 250mg'\n    },\n    {\n      hora: '16:00', nome: 'Lanche', kcal: '~420 kcal',\n      items: [\n        { t:'Iogurte grego natural sem açúcar — 170 g (1 pote)', k:150 },\n        { t:'Fruta rica em vit. C — 200 g (acerola, laranja, kiwi, goiaba, morango)', k:100 },\n        { t:'Castanhas ou amêndoas sem sal — 25 g (1 punhado)', k:170 }],\n      sup: '💊 Cúrcuma 500mg+piperina · Vit. C 250mg (2ª dose) — afastado do treino'\n    },\n    {\n      hora: '19:00', nome: 'Jantar — seu pré-treino', kcal: t==='treino'?'~770 kcal':'~650 kcal',\n      items: t==='treino' ? [\n        { t:'Proteína magra grelhada — 200 g (≈ 260 g cru)', k:330 },\n        { t:'Macarrão cozido — 220 g (≈ 100 g cru)', k:310 },\n        { t:'Molho de tomate com cenoura e abobrinha raladas — 120 g', k:40 },\n        { t:'Salada + 1 col. sopa de azeite — 120 g', k:90 },\n      ] : [\n        { t:'Proteína magra grelhada — 200 g (≈ 260 g cru)', k:330 },\n        { t:'Legumes refogados — 200 g (≈ 250 g crus)', k:130 },\n        { t:'Arroz integral cozido — 90 g (3 col. sopa cheias) (≈ 30 g cru)', k:100 },\n        { t:'Salada + 1 col. sopa de azeite — 120 g', k:90 },\n      ],\n      sup: '💊 Berberina 500mg (30min antes) · Enzimas (início da refeição)'\n    },\n    {\n      hora: '22:30', nome: t==='treino'?'Pós-treino':'Whey (opcional)', kcal: t==='treino'?'~120 kcal':'~0–120 kcal',\n      items: t==='treino' ? [\n        { t:'Whey em pó — 30 g (1 scoop)', k:120 },\n      ] : [\n        { t:'Whey em pó — 30 g (1 scoop)', k:120 },\n      ],\n      sup: '💊 Creatina 5g · Inositol 2–4g (sono + insulina noturna)'\n    },\n  ];\n\n  const proteins = [\n    { dias: '2 dias', nome: 'Filé de frango grelhado', nota: 'Base da semana', c: 'blue' },\n    { dias: '1 dia', nome: 'Carne moída magra (patinho 90/10)', nota: 'Hambúrguer caseiro OU bolonhesa', c: 'orange' },\n    { dias: '1–2 dias', nome: 'Bisteca suína magra', nota: 'Assada no forno', c: 'purple' },\n    { dias: '1 dia', nome: 'Fígado acebolado', nota: 'Ferro heme + B12', c: 'red' },\n  ];\n\n  return sectionTitle('🥗', 'Protocolo Nutricional', '') +\n    card(`<h3>Base Calórica (Mifflin-St Jeor)<\u002Fh3>\n      ${row('Metabolismo basal', '~1.850–1.900 kcal', null, 'bioimpedância mediu 1.884 a 84,9 kg')}\n      ${row('Gasto total', '~2.700–2.850 kcal', null, '6 dias de atividade + trabalho')}\n      ${row('Déficit', '~600–700 kcal/dia', 'orange')}\n      ${row('Projeção', '~0,9 kg/mês', 'green', 'taxa histórica comprovada')}\n      ${row('Proteína alvo', '140–160 g/dia', null, 'massa livre de gordura ~58,8 kg')}\n      <div class=\"toggle\">\n        <button data-act=\"setDayType\" data-val=\"treino\" class=\"${t==='treino'?'active':''}\">💪 Dia de academia<\u002Fbutton>\n        <button data-act=\"setDayType\" data-val=\"descanso\" class=\"${t==='descanso'?'active':''}\">😴 Outros dias<\u002Fbutton>\n      <\u002Fdiv>\n      <div class=\"stat mt-3\" style=\"padding:14px\">\n        <div class=\"v\" style=\"font-size:22px\">${macros.kcal}<\u002Fdiv>\n        <div class=\"grid-3 mt-2\">\n          <div class=\"stat\" style=\"background:#fff\"><div class=\"l\">🥩 Proteína<\u002Fdiv><div style=\"font-weight:700;font-size:13px\">${macros.p}<\u002Fdiv><div class=\"l\">${macros.pc}<\u002Fdiv><\u002Fdiv>\n          <div class=\"stat\" style=\"background:#fff\"><div class=\"l\">🌾 Carbo<\u002Fdiv><div style=\"font-weight:700;font-size:13px\">${macros.c}<\u002Fdiv><div class=\"l\">${macros.cc}<\u002Fdiv><\u002Fdiv>\n          <div class=\"stat\" style=\"background:#fff\"><div class=\"l\">🥑 Gordura<\u002Fdiv><div style=\"font-weight:700;font-size:13px\">${macros.g}<\u002Fdiv><div class=\"l\">${macros.gc}<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>`) +\n    card(`<h3>⏱️ Janela Alimentar<\u002Fh3>\n      <div style=\"font-size:12px;color:#475569;line-height:1.5\">Jejum <strong>16:8<\u002Fstrong> — 1ª refeição 12:30, última 19:00, whey pós-treino 22:30.<\u002Fdiv>`) +\n    card(`<h3>Refeições — ${t==='treino' ? 'Dia de Treino' : 'Dia de Descanso'}<\u002Fh3>\n      ${meals.map(m => `<div class=\"meal\">\n        <div class=\"meal-hdr\"><div><span class=\"hora\">${m.hora} · <\u002Fspan><span class=\"name\">${h(m.nome)}<\u002Fspan><\u002Fdiv>${tag(m.kcal,'blue')}<\u002Fdiv>\n        <ul>${m.items.map(it => `<li style=\"display:flex;gap:8px;align-items:baseline\"><span style=\"flex:1\">${h(it.t)}<\u002Fspan><span style=\"flex-shrink:0;font-size:11px;font-weight:700;color:#94a3b8;font-variant-numeric:tabular-nums\">${it.k} kcal<\u002Fspan><\u002Fli>`).join('')}<\u002Ful>\n        ${m.sup ? `<div class=\"meal-sup\">${h(m.sup)}<\u002Fdiv>` : ''}\n      <\u002Fdiv>`).join('')}`) +\n    card('<h3>🍟 Fim de semana<\u002Fh3>'\n      +'<div class=\"chips\">'+['Uma refeição livre por semana, não dois dias livres','Delivery: proteína grelhada + carboidrato + legume','Sem fritura, pizza ou lanche com pão grande'].map(x=>'<div class=\"chip\">'+h(x)+'<\u002Fdiv>').join('')+'<\u002Fdiv>') +\n    card('<h3>🍊 Vitamina C<\u002Fh3>'\n      +'<div class=\"box red\" style=\"margin-top:0\">Ácido ascórbico <strong>0,3 mg/dL<\u002Fstrong> (ref. 0,4–2,0) e caindo — era 0,5 em out/25. Participa da síntese de colágeno.<\u002Fdiv>'\n      +'<div class=\"chips\">'+['Acerola, laranja, kiwi, morango, goiaba','Pimentão, brócolis, couve','Reavaliar em 3 meses'].map(x=>'<div class=\"chip\">'+h(x)+'<\u002Fdiv>').join('')+'<\u002Fdiv>') +\n    card(`<h3>🥩 Rotação Semanal de Proteínas<\u002Fh3>\n      <div style=\"display:flex;flex-direction:column;gap:8px\">${proteins.map(p => `\n        <div class=\"meal\" style=\"margin-bottom:0\">\n          <div class=\"meal-hdr\"><span class=\"name\">${h(p.nome)}<\u002Fspan>${tag(p.dias,p.c)}<\u002Fdiv>\n          <div style=\"font-size:11px;color:#64748b\">${h(p.nota)}<\u002Fdiv>\n        <\u002Fdiv>`).join('')}\n      <\u002Fdiv>`);\n}\n\n// ─── TAB 3 · TREINO ─────────────────────────────────────────────────\nconst GRUPOS = {\n  quad:        { n:'Quadríceps', em:'🦵', med:true },\n  costas:      { n:'Costas / dorsal', em:'🔙' },\n  peito:       { n:'Peito', em:'🫀' },\n  biceps:      { n:'Bíceps', em:'💪' },\n  triceps:     { n:'Tríceps', em:'🔧' },\n  post:        { n:'Posterior de coxa', em:'🦵', med:true },\n  gluteoMax:   { n:'Glúteo máximo', em:'🍑' },\n  ombroLat:    { n:'Ombro lateral', em:'🎯' },\n  deltPost:    { n:'Deltoide posterior', em:'🎯' },\n  ombroAnt:    { n:'Ombro anterior', em:'🎯' },\n  gluteoMed:   { n:'Glúteo médio', em:'⭐', med:true },\n  panturrilha: { n:'Panturrilha / sóleo', em:'🦶' },\n};\n\nconst SESSIONS = {\n  fullA: {\n    label: '🟦 Full Body A', day: 'Segunda', sub: 'Quadríceps + empurrar',\n    ex: [\n      { n:'Leg press', sr:'4×8–10', rest:'120s', rir:'2', cad:1, amp:1, g:['quad'], gi:['gluteoMax'] },\n      { n:'Agachamento no Smith ou Hack', sr:'4×10–12', rest:'90s', rir:'2', cad:1, amp:1, g:['quad'], gi:['gluteoMax'] },\n      { n:'Cadeira abdutora', sr:'3×15–20', rest:'60s', rir:'1', g:['gluteoMed'], star:'Glúteo médio — prioridade médica. Fraqueza deixa o joelho colapsar para dentro.' },\n      { n:'Supino reto com halteres', sr:'4×8–10', rest:'90s', rir:'2', g:['peito'], gi:['triceps','ombroAnt'] },\n      { n:'Supino inclinado na máquina (~30°)', sr:'3×10–12', rest:'75s', rir:'1', g:['peito'], gi:['triceps','ombroAnt'] },\n      { n:'Remada na máquina c/ peito apoiado', sr:'4×8–10', rest:'90s', rir:'2', g:['costas'], gi:['biceps','deltPost'] },\n      { n:'Desenvolvimento na máquina sentado', sr:'3×10–12', rest:'75s', rir:'1', g:['ombroAnt'], gi:['triceps','ombroLat'] },\n      { n:'Elevação lateral com halteres', sr:'4×12–15', rest:'60s', rir:'1', g:['ombroLat'] },\n      { n:'Tríceps na corda', sr:'4×12–15', rest:'—', rir:'1', bi:'A', g:['triceps'] },\n      { n:'Rosca direta na barra W', sr:'4×10–12', rest:'60s', rir:'1', bi:'B', g:['biceps'] },\n      { n:'Panturrilha sentado', sr:'3×12–15', rest:'45s', rir:'1', g:['panturrilha'] },\n    ],\n  },\n  fullB: {\n    label: '🟩 Full Body B', day: 'Quinta', sub: 'Posterior + puxar',\n    ex: [\n      { n:'Levantamento stiff com barra', sr:'4×8–10', rest:'120s', rir:'2', cad:1, g:['post','gluteoMax'] },\n      { n:'Leg press (2ª dose)', sr:'4×10–12', rest:'90s', rir:'2', cad:1, amp:1, g:['quad'], gi:['gluteoMax'] },\n      { n:'Elevação de quadril (hip thrust)', sr:'3×10–12', rest:'75s', rir:'1', cad:1, g:['post','gluteoMax'] },\n      { n:'Caminhada lateral com miniband', sr:'3×15/lado', rest:'60s', rir:'1', cad:1, g:['gluteoMed'], star:'Faixa acima dos joelhos, agache levemente, joelhos abertos.' },\n      { n:'Puxada frontal aberta (graviton)', sr:'4×8–10', rest:'90s', rir:'2', g:['costas'], gi:['biceps','deltPost'] },\n      { n:'Remada baixa ou serrote', sr:'3×10–12', rest:'75s', rir:'1', g:['costas'], gi:['biceps','deltPost'] },\n      { n:'Crucifixo invertido na máquina', sr:'4×12–15', rest:'60s', rir:'1', g:['deltPost'] },\n      { n:'Supino inclinado com halteres', sr:'3×10–12', rest:'75s', rir:'1', g:['peito'], gi:['triceps','ombroAnt'] },\n      { n:'Rosca scott na barra W', sr:'4×8–10', rest:'—', rir:'1', bi:'A', g:['biceps'] },\n      { n:'Tríceps francês na polia (corda)', sr:'4×10–12', rest:'75s', rir:'1', bi:'B', g:['triceps'] },\n      { n:'Panturrilha sentado', sr:'3×12–15', rest:'45s', rir:'1', g:['panturrilha'] },\n    ],\n  },\n};\n\n// Atividades sem carga — só registro de presença\nconst ATIVIDADES = {\n  natacao:  { n:'Natação', em:'🏊', cor:'#0ea5e9' },\n  pilates:  { n:'Pilates', em:'🧘', cor:'#8b5cf6' },\n  pilatesL: { n:'Pilates leve', em:'🧘', cor:'#8b5cf6' },\n  futebol:  { n:'Futebol', em:'⚽', cor:'#22c55e' },\n};\n\n// 0=Dom … 6=Sáb\nconst SEMANA = [\n  { dow:1, d:'Seg', gym:'fullA', acts:[] },\n  { dow:2, d:'Ter', gym:null,    acts:['natacao'] },\n  { dow:3, d:'Qua', gym:null,    acts:['pilates'] },\n  { dow:4, d:'Qui', gym:'fullB', acts:[] },\n  { dow:5, d:'Sex', gym:null,    acts:['natacao'] },\n  { dow:6, d:'Sáb', gym:null,    acts:['pilatesL','futebol'] },\n  { dow:0, d:'Dom', gym:null,    acts:[] },\n];\n\nfunction volumeSemanal(){\n  const d={}, ind={};\n  Object.keys(GRUPOS).forEach(g=>{ d[g]=0; ind[g]=0; });\n  ['fullA','fullB'].forEach(id=>SESSIONS[id].ex.forEach(e=>{\n    const n=ctSetCount(e.sr);\n    (e.g||[]).forEach(g=>{ if(d[g]!=null) d[g]+=n; });\n    (e.gi||[]).forEach(g=>{ if(ind[g]!=null) ind[g]+=n; });\n  }));\n  return { d:d, ind:ind };\n}\nfunction totalSeries(){ return ['fullA','fullB'].reduce((a,id)=>a+SESSIONS[id].ex.reduce((b,e)=>b+ctSetCount(e.sr),0),0); }\n\n// Topo da faixa de reps (ex: '4×8–10' → 10)\nfunction repTopo(sr){ const m=String(sr).match(/(\\d+)\\s*[–-]\\s*(\\d+)\\s*$/); if(m) return parseInt(m[2],10); const m2=String(sr).match(/×\\s*(\\d+)/); return m2?parseInt(m2[1],10):null; }\n\nfunction getPhase(w) {\n  if (w <= 2) return { name:'Calibração', weeks:'Sem. 1–2', rir:'RIR 3', instr:'Encontre as cargas. Sem buscar recorde — foco em execução.', tech:[], cls:'blue' };\n  if (w <= 6) return { name:'Acumulação', weeks:'Sem. 3–6', rir:'RIR 2', instr:'Progressão de carga sessão a sessão. Fase principal.', tech:[], cls:'orange' };\n  if (w === 7) return { name:'Semana leve', weeks:'Sem. 7', rir:'RIR 3–4', instr:'Mesmo treino, ~70% da carga. Recuperação.', tech:[], cls:'green' };\n  if (w <= 11) return { name:'Intensificação', weeks:'Sem. 8–11', rir:'RIR 1–2', instr:'+1 série nos exercícios 1 e 2 de cada treino.', tech:[], cls:'red' };\n  return { name:'Reavaliação', weeks:'Sem. 12', rir:'RIR 2', instr:'Cargas da semana 11 + medidas + exames.', tech:[], cls:'violet' };\n}\nconst weekClass = (w) => w<=2?'b':w<=6?'o':w===7?'g':w<=11?'r':'v';\nconst weekTagColor = (cls) => ({blue:'blue',orange:'orange',red:'red',green:'green',violet:'purple'})[cls];\n\nfunction techBadge(tech, phase) {\n  const isDrop = tech === 'drop';\n  const active = phase.tech.includes(tech);\n  const label = isDrop ? '🔻 Drop-set' : '⏸️ Rest-pause';\n  const desc = isDrop ? 'Última série: falha → reduz 30–40% peso → +6–10 reps'\n    : 'Última série: falha → 15s pausa → +3–5 reps → 15s pausa → +2–3 reps';\n  if (active) {\n    return `<div class=\"tech-badge active ${isDrop?'drop':'rest'}\">\n      <div class=\"tb-title\">${label} · ATIVO esta semana<\u002Fdiv>\n      <div>${desc}<\u002Fdiv><\u002Fdiv>`;\n  }\n  return `<div class=\"tech-badge inactive\">${label} programado · inativo nesta fase<\u002Fdiv>`;\n}\n\nfunction renderTraining() {\n  const w = STATE.week;\n  const phase = getPhase(w);\n  if (!SESSIONS[STATE.session]) STATE.session = 'fullA';\n  const sess = SESSIONS[STATE.session];\n\n  const weekBtns = Array.from({length:12}, (_,i)=>i+1).map(wn =>\n    '<button class=\"'+(wn===w?'current':weekClass(wn))+'\" data-act=\"setWeek\" data-val=\"'+wn+'\">'+wn+'<\u002Fbutton>').join('');\n\n  const V = volumeSemanal();\n  const volRows = Object.keys(GRUPOS).map(g => {\n    const dir=V.d[g], ind=V.ind[g], efe=dir+Math.round(ind*0.5);\n    const cor = GRUPOS[g].med ? '#0f172a' : efe>=10 ? '#22c55e' : efe>=6 ? '#f59e0b' : '#ef4444';\n    return '<div style=\"margin-bottom:10px\">'\n      +'<div style=\"display:flex;align-items:baseline;gap:6px;margin-bottom:4px\">'\n      +'<span style=\"font-size:12px;font-weight:'+(GRUPOS[g].med?'800':'600')+';color:#334155\">'+GRUPOS[g].em+' '+GRUPOS[g].n+'<\u002Fspan>'\n      +(GRUPOS[g].med?'<span style=\"font-size:9px;font-weight:800;color:#fff;background:#0f172a;padding:2px 6px;border-radius:999px\">MÉDICO<\u002Fspan>':'')\n      +'<span style=\"margin-left:auto;font-size:12px;font-weight:800;color:'+cor+'\">'+dir+'<\u002Fspan>'\n      +(ind?'<span style=\"font-size:10px;color:#94a3b8\">+'+ind+' indir. · efe. '+efe+'<\u002Fspan>':'')\n      +'<\u002Fdiv>'\n      +'<div style=\"height:7px;background:#f1f5f9;border-radius:999px;overflow:hidden;position:relative\">'\n      +'<div style=\"position:absolute;left:50%;top:0;bottom:0;width:1px;background:#cbd5e1\"><\u002Fdiv>'\n      +'<div style=\"height:100%;width:'+Math.min(100,dir/20*100)+'%;background:'+cor+';border-radius:999px\"><\u002Fdiv><\u002Fdiv><\u002Fdiv>';\n  }).join('');\n\n  const diasHtml = SEMANA.map(x => {\n    const partes = [];\n    if (x.gym) partes.push(SESSIONS[x.gym].label.replace(/^\\S+\\s/,''));\n    x.acts.forEach(a => partes.push(ATIVIDADES[a].n));\n    const em = x.gym ? '🏋️' : (x.acts.length ? ATIVIDADES[x.acts[0]].em : '😴');\n    const txt = partes.length ? partes.join(' + ') : 'Descanso';\n    const cls = 'day ' + (x.gym ? 'clickable' : 'off') + (x.gym===STATE.session ? ' active' : '');\n    return '<button class=\"'+cls+'\"'+(x.gym?' data-act=\"setSession\" data-val=\"'+x.gym+'\"':' disabled')+'><span class=\"em\">'+em+'<\u002Fspan><div><div class=\"d\">'+x.d+'<\u002Fdiv><div class=\"t\">'+h(txt)+'<\u002Fdiv><\u002Fdiv><\u002Fbutton>';\n  }).join('');\n\n  const exHtml = sess.ex.map((e,i) =>\n    '<div class=\"ex\"'+(e.star?' style=\"border-left:4px solid #0f172a\"':'')+'>'\n      +'<div class=\"head\"><span class=\"num\">'+(i+1)+'.<\u002Fspan><span class=\"name\">'+h(e.n)+(e.star?' ⭐':'')+'<\u002Fspan><\u002Fdiv>'\n      +((e.cad||e.amp||e.bi)?'<div style=\"display:flex;gap:5px;flex-wrap:wrap;margin-top:6px\">'\n        +(e.bi?'<span style=\"font-size:9px;font-weight:800;color:#7c3aed;background:#f5f3ff;border:1px solid #ddd6fe;padding:3px 7px;border-radius:999px\">BISÉRIE '+e.bi+'<\u002Fspan>':'')\n        +(e.cad?'<span style=\"font-size:9px;font-weight:700;color:#15803d;background:#f0fdf4;border:1px solid #bbf7d0;padding:3px 7px;border-radius:999px\">🟢 CADEIA FECHADA<\u002Fspan>':'')\n        +(e.amp?'<span style=\"font-size:9px;font-weight:700;color:#b45309;background:#fffbeb;border:1px solid #fde68a;padding:3px 7px;border-radius:999px\">⚠️ MÁX. 90°<\u002Fspan>':'')\n        +'<\u002Fdiv>':'')\n      +'<div class=\"stats\">'\n        +'<div class=\"stat-mini\"><div class=\"k\">Séries<\u002Fdiv><div class=\"v\">'+h(e.sr)+'<\u002Fdiv><\u002Fdiv>'\n        +'<div class=\"stat-mini\"><div class=\"k\">Rest<\u002Fdiv><div class=\"v\">'+h(e.rest)+'<\u002Fdiv><\u002Fdiv>'\n        +'<div class=\"stat-mini\" style=\"background:#fff7ed;border-color:#fed7aa\"><div class=\"k\" style=\"color:#c2410c\">RIR<\u002Fdiv><div class=\"v\" style=\"color:#c2410c\">'+h(e.rir)+'<\u002Fdiv><\u002Fdiv>'\n      +'<\u002Fdiv>'\n      +(e.star?'<div class=\"box slate\" style=\"margin-top:8px;font-size:11px\">'+h(e.star)+'<\u002Fdiv>':'')\n      +'<\u002Fdiv>').join('');\n\n  const totSess = sess.ex.reduce((a,e)=>a+ctSetCount(e.sr),0);\n\n  return sectionTitle('💪', 'Planilha de Treino', '') +\n    card('<h3>📍 Onde Você Está<\u002Fh3>'\n      +'<div class=\"week-banner '+phase.cls+'\">'\n      +'<div class=\"top\"><div class=\"ph\">Sem. '+w+' · '+h(phase.name)+'<\u002Fdiv>'+tag(phase.rir, weekTagColor(phase.cls))+'<\u002Fdiv>'\n      +'<div class=\"instr\">'+h(phase.instr)+'<\u002Fdiv><\u002Fdiv>'\n      +'<div class=\"grid-6 week-grid\">'+weekBtns+'<\u002Fdiv>') +\n    card('<h3>📅 Sua semana<\u002Fh3>'+diasHtml) +\n    card('<h3>📊 Volume semanal por grupo<\u002Fh3>'\n      +'<div style=\"font-size:11px;color:#94a3b8;margin-bottom:10px\">A + B · séries diretas · linha do meio = 10<\u002Fdiv>'\n      +volRows\n      +row('Total','79 séries/semana','green','40 no treino A + 39 no B')\n      +row('Core','Pilates 2×/semana',null,'sem abdominal direto')) +\n    card('<h3>📈 Progressão (dupla progressão)<\u002Fh3>'\n      +'<div class=\"chips\">'\n      +['Comece na parte baixa da faixa de reps','A cada sessão tente +reps mantendo a carga','Todas as séries no topo da faixa com o RIR alvo → sobe a carga','+5% nos compostos · +2,5 kg ou menos nos isoladores','Ao subir, as reps voltam à base da faixa'].map((it,i)=>'<div class=\"chip numbered\"><span class=\"num\">'+(i+1)+'.<\u002Fspan>'+h(it)+'<\u002Fdiv>').join('')\n      +'<\u002Fdiv>'\n      +'<div class=\"box red\">Reps caindo entre as séries (ex: 10, 8, 7) = carga alta demais. Mantenha até fechar todas no topo.<\u002Fdiv>'\n      +'<div class=\"box amber\">Se em 2 sessões seguidas você não repetir a carga anterior, antecipe a semana leve.<\u002Fdiv>') +\n    card('<div class=\"sess-tabs\">'\n      +[{id:'fullA',em:'🟦',d:'Seg'},{id:'fullB',em:'🟩',d:'Qui'}].map(b=>'<button data-act=\"setSession\" data-val=\"'+b.id+'\" class=\"'+(STATE.session===b.id?'active':'')+'\"><div class=\"em\">'+b.em+'<\u002Fdiv><div class=\"d\">'+b.d+'<\u002Fdiv><\u002Fbutton>').join('')\n      +'<\u002Fdiv>'\n      +'<div class=\"sess-hdr\"><div class=\"l\">'+h(sess.label)+' · '+h(sess.day)+'<\u002Fdiv><div class=\"s\">'+h(sess.sub)+' · '+totSess+' séries · ~80 min<\u002Fdiv><\u002Fdiv>'\n      +exHtml\n      +'<div class=\"box slate\">Bisséries 9A + 9B: sem pausa entre elas, descanso só no fim.<\u002Fdiv>') +\n    card('<h3>🚫 Restrições<\u002Fh3>'\n      +'<div class=\"grid-2\">'+['Sem cadeira extensora','Sem agachamento livre pesado','Sem descer além de 90°','Sem saltos nem impacto','Sem panturrilha em pé','Sem abdominal direto'].map(n=>'<div class=\"chip bad\">✗ '+h(n)+'<\u002Fdiv>').join('')+'<\u002Fdiv>'\n      +'<div class=\"box amber\">Perguntar ao fisioterapeuta: <strong>mesa flexora liberada?<\u002Fstrong> Se sim, entra no treino B e o posterior sobe de 7 para 10 séries.<\u002Fdiv>') +\n    card('<h3>🔥 Aquecimento antes de perna<\u002Fh3>'\n      +'<div class=\"chips\">'+['5 min de bicicleta ergométrica, sem carga alta','1 série de leg press bem leve, 15 reps','Só então a primeira série valendo'].map((it,i)=>'<div class=\"chip numbered\"><span class=\"num\">'+(i+1)+'.<\u002Fspan>'+h(it)+'<\u002Fdiv>').join('')+'<\u002Fdiv>');\n}\n\n// ─── TAB 4 · SUPLEMENTOS ────────────────────────────────────────────\nfunction renderSupps() {\n  const slots = [\n    {\n      hora: '12:30', nome: 'Almoço',\n      sups: [\n        { n:'Berberina', d:'500 mg', note:'30 min ANTES do almoço' },\n        { n:'Enzimas digestivas', d:'1 cáp', note:'Com o início da refeição (não 30 min antes)' },\n        { n:'Picolinato de cromo', d:'200 mcg', note:'Sensibilidade insulínica — refeição com mais carbo do dia' },\n        { n:'Vit. D3 + K2 MK-7', d:'4.000 UI + 100 mcg', note:'Lipossolúvel — precisa da gordura do almoço' },\n        { n:'Ômega 3', d:'2 g EPA+DHA', note:'Forma TG > EE · refrigerar após aberto' },\n        { n:'Cúrcuma (1ª)', d:'500 mg', note:'Com piperina (pimenta-preta moída na hora) OU Meriva/Theracurmin' },\n        { n:'Vitamina C (1ª)', d:'250 mg', note:'Dose fracionada — absorção saturada acima de ~200mg' },\n      ]\n    },\n    {\n      hora: '16:00', nome: 'Lanche',\n      sups: [\n        { n:'Cúrcuma (2ª)', d:'500 mg', note:'Afastada do treino — antioxidante atenua adaptação aguda' },\n        { n:'Vitamina C (2ª)', d:'250 mg', note:'2ª metade da dose · longe do treino noturno' },\n      ]\n    },\n    {\n      hora: '19:00', nome: 'Jantar',\n      sups: [\n        { n:'Berberina', d:'500 mg', note:'30 min ANTES do jantar — 2ª dose do dia' },\n        { n:'Enzimas digestivas', d:'1 cáp', note:'Refeição com 180g de proteína' },\n      ]\n    },\n    {\n      hora: '22:30', nome: 'Pós-treino / antes de dormir',\n      sups: [\n        { n:'Creatina monoidratada', d:'5 g', note:'Não precisa loading · não ciclar · todo dia, inclusive descanso' },\n        { n:'Inositol (Myo)', d:'2–4 g', note:'Melhora sono + sensibilidade insulínica noturna' },\n      ]\n    },\n  ];\n\n  return sectionTitle('💊', 'Protocolo de Suplementação', '') +\n    card(`<h3>🗓️ Cronograma Diário<\u002Fh3>\n      ${slots.map(slot => `\n        <div class=\"meal\">\n          <div class=\"meal-hdr\">\n            <div><span class=\"hora\">${slot.hora} · <\u002Fspan><span class=\"name\">${h(slot.nome)}<\u002Fspan><\u002Fdiv>\n            ${tag(slot.sups.length + (slot.sups.length===1?' suplemento':' suplementos'), 'blue')}\n          <\u002Fdiv>\n          ${slot.sups.map(x => `\n            <div style=\"background:#fff;b nction miniChart(data, field, color, goal, unit, label) {\n    const vals = data.map(r => r[field]).filter(v => v != null);\n    if (!vals.length) return '';\n    const W = 320, H = 90, PAD = { t:8, r:8, b:28, l:36 };\n    const cW = W - PAD.l - PAD.r;\n    const cH = H - PAD.t - PAD.b;\n    const mn = Math.min(...vals, goal ?? Infinity) - 2;\n    const mx = Math.max(...vals) + 2;\n    const pts = data.map((r,i) => r[field] != null ? [PAD.l + (i/(allData.length-1||1))*cW, PAD.t + (1-(r[field]-mn)/(mx-mn))*cH] : null).filter(Boolean);\n    const path = pts.map((p,i) => (i===0?'M':'L')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');\n    const goalY = goal != null ? (PAD.t + (1-(goal-mn)/(mx-mn))*cH) : null;\n    const last = vals[vals.length-1];\n    const first = vals[0];\n    const delta = last - first;\n    const deltaStr = (delta > 0 ? '+' : '') + delta.toFixed(1);\n    const deltaColor = field === 'braco' || field === 'peito' ? (delta >= 0 ? '#22c55e' : '#ef4444') : (delta <= 0 ? '#22c55e' : '#ef4444');\n    // x-axis labels — show every ~6 entries\n    const xLabels = data.filter((_,i) => i % 6 === 0 || i === data.length-1).map((r,_,arr) => {\n      const origI = data.indexOf(r);\n      const x = PAD.l + (origI/(allData.length-1||1))*cW;\n      return `<text x=\"${x.toFixed(1)}\" y=\"${H-4}\" text-anchor=\"middle\" font-size=\"8\" fill=\"#94a3b8\">${r.d}<\u002Ftext>`;\n    }).join('');\n    return `<div style=\"background:#fff;border-radius:14px;border:1px solid #f1f5f9;padding:12px 10px 8px;margin-bottom:10px\">\n      <div style=\"display:flex;justify-content:space-between;align-items:center;margin-bottom:6px\">\n        <span style=\"font-size:12px;font-weight:700;color:#1e293b\">${label}<\u002Fspan>\n        <span style=\"font-size:11px;font-weight:600;color:${deltaColor}\">${deltaStr}${unit} total<\u002Fspan>\n      <\u002Fdiv>\n      <svg width=\"100%\" viewBox=\"0 0 ${W} ${H}\" style=\"overflow:visible\">\n        ${goalY != null ? `<line x1=\"${PAD.l}\" y1=\"${goalY.toFixed(1)}\" x2=\"${PAD.l+cW}\" y2=\"${goalY.toFixed(1)}\" stroke=\"#22c55e\" stroke-width=\"1\" stroke-dasharray=\"4,3\" opacity=\".6\"/>\n        <text x=\"${PAD.l+cW+2}\" y=\"${(goalY+3).toFixed(1)}\" font-size=\"8\" fill=\"#22c55e\">meta<\u002Ftext>` : ''}\n        <polyline fill=\"none\" stroke=\"${color}\" stroke-width=\"2\" stroke-linejoin=\"round\" stroke-linecap=\"round\" points=\"${pts.map(p=>p.join(',')).join(' ')}\"/>\n        ${pts.map((p,i) => i===pts.length-1 ? `<circle cx=\"${p[0].toFixed(1)}\" cy=\"${p[1].toFixed(1)}\" r=\"3\" fill=\"${color}\"/>` : '').join('')}\n        ${data.map((r,i) => {\n          const y = PAD.t + (1-(( r[field]??mn)-mn)/(mx-mn))*cH;\n          const v = r[field];\n          if (!v) return '';\n          const x = PAD.l + (i/(allData.length-1||1))*cW;\n          return `<text x=\"${x.toFixed(1)}\" y=\"${Math.max(PAD.t+8,(y-5)).toFixed(1)}\" text-anchor=\"middle\" font-size=\"7.5\" fill=\"#64748b\">${v}<\u002Ftext>`;\n        }).join('')}\n        <line x1=\"${PAD.l}\" y1=\"${PAD.t}\" x2=\"${PAD.l}\" y2=\"${PAD.t+cH}\" stroke=\"#e2e8f0\" stroke-width=\"1\"/>\n        <line x1=\"${PAD.l}\" y1=\"${PAD.t+cH}\" x2=\"${PAD.l+cW}\" y2=\"${PAD.t+cH}\" stroke=\"#e2e8f0\" stroke-width=\"1\"/>\n        ${xLabels}\n      <\u002Fsvg>\n      <div style=\"display:flex;justify-content:space-between;font-size:10px;color:#94a3b8;margin-top:2px\">\n        <span>Início: <b style=\"color:#1e293b\">${first}${unit}<\u002Fb><\u002Fspan>\n        <span>Mínimo: <b style=\"color:#1e293b\">${Math.min(...vals)}${unit}<\u002Fb><\u002Fspan>\n        <span>Agora: <b style=\"color:${color}\">${last}${unit}<\u002Fb><\u002Fspan>\n        ${goal != null ? `<span>Meta: <b style=\"color:#22c55e\">${goal}${unit}<\u002Fb><\u002Fspan>` : ''}\n      <\u002Fdiv>\n    <\u002Fdiv>`;\n  }\n\n  // Add measurement form HTML\n  const formHtml = `\n    <div class=\"card\" style=\"margin-bottom:12px\">\n      <h3>➕ Adicionar medição<\u002Fh3>\n      <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px\">\n        <div><label style=\"font-size:11px;color:#64748b;display:block;margin-bottom:3px\">Data<\u002Flabel>\n          <input id=\"h_data\" type=\"text\" placeholder=\"Ex: Jun/26\" style=\"width:100%;padding:7px 10px;border:1px solid #e2e8f0;border-radius:8px;font-size:13px;color:#1e293b\"><\u002Fdiv>\n        <div><label style=\"font-size:11px;color:#64748b;display:block;margin-bottom:3px\">Peso (kg)<\u002Flabel>\n          <input id=\"h_peso\" type=\"number\" step=\"0.1\" placeholder=\"93.0\" style=\"width:100%;padding:7px 10px;border:1px solid #e2e8f0;border-radius:8px;font-size:13px;color:#1e293b\"><\u002Fdiv>\n        <div><label style=\"font-size:11px;color:#64748b;display:block;margin-bottom:3px\">Cintura (cm)<\u002Flabel>\n          <input id=\"h_cintura\" type=\"number\" step=\"0.5\" placeholder=\"88\" style=\"width:100%;padding:7px 10px;border:1px solid #e2e8f0;border-radius:8px;font-size:13px;color:#1e293b\"><\u002Fdiv>\n        <div><label style=\"font-size:11px;color:#64748b;display:block;margin-bottom:3px\">Abdome (cm)<\u002Flabel>\n          <input id=\"h_abdome\" type=\"number\" step=\"0.5\" placeholder=\"90\" style=\"width:100%;padding:7px 10px;border:1px solid #e2e8f0;border-radius:8px;font-size:13px;color:#1e293b\"><\u002Fdiv>\n        <div><label style=\"font-size:11px;color:#64748b;display:block;margin-bottom:3px\">Quadril (cm)<\u002Flabel>\n          <input id=\"h_quadril\" type=\"number\" step=\"0.5\" placeholder=\"105\" style=\"width:100%;padding:7px 10px;border:1px solid #e2e8f0;border-radius:8px;font-size:13px;color:#1e293b\"><\u002Fdiv>\n        <div><label style=\"font-size:11px;color:#64748b;display:block;margin-bottom:3px\">Braço relax. (cm)<\u002Flabel>\n          <input id=\"h_braco\" type=\"number\" step=\"0.5\" placeholder=\"34\" style=\"width:100%;padding:7px 10px;border:1px solid #e2e8f0;border-radius:8px;font-size:13px;color:#1e293b\"><\u002Fdiv>\n        <div><label style=\"font-size:11px;color:#64748b;display:block;margin-bottom:3px\">Peitoral (cm)<\u002Flabel>\n          <input id=\"h_peito\" type=\"number\" step=\"0.5\" placeholder=\"98\" style=\"width:100%;padding:7px 10px;border:1px solid #e2e8f0;border-radius:8px;font-size:13px;color:#1e293b\"><\u002Fdiv>\n        <div><label style=\"font-size:11px;color:#64748b;display:block;margin-bottom:3px\">% Gordura<\u002Flabel>\n          <input id=\"h_pct\" type=\"number\" step=\"0.1\" placeholder=\"31.0\" style=\"width:100%;padding:7px 10px;border:1px solid #e2e8f0;border-radius:8px;font-size:13px;color:#1e293b\"><\u002Fdiv>\n      <\u002Fdiv>\n      <button onclick=\"addHistMed()\" style=\"width:100%;background:#0f172a;color:#fff;border-radius:10px;padding:10px;font-size:13px;font-weight:700\">Salvar medição<\u002Fbutton>\n      ${userMeds.length ? `<button onclick=\"clearHistMed()\" style=\"width:100%;margin-top:6px;color:#ef4444;font-size:11px;padding:4px\">Limpar medições adicionadas<\u002Fbutton>` : ''}\n    <\u002Fdiv>`;\n\n  const recordDefs = [\n    {f:'peso', mode:'min', label:'Peso', unit:'kg', color:'#60a5fa'},\n    {f:'cintura', mode:'min', label:'Cintura', unit:'cm', color:'#34d399'},\n    {f:'abdome', mode:'min', label:'Abdome', unit:'cm', color:'#fb923c'},\n    {f:'pct', mode:'min', label:'% Gordura', unit:'%', color:'#a78bfa'},\n    {f:'quadril', mode:'min', label:'Quadril', unit:'cm', color:'#f472b6'},\n    {f:'braco', mode:'max', label:'Braço', unit:'cm', color:'#fbbf24'},\n    {f:'peito', mode:'max', label:'Peitoral', unit:'cm', color:'#38bdf8'},\n  ];\n  const bestMark = (field, mode) => {\n    let best=null, when=null, cur=null;\n    allData.forEach(r => { const v=r[field]; if(v==null) return; cur=v; if(best==null || (mode==='min'? v<best : v>best)){ best=v; when=r.d; } });\n    return best==null ? null : { best, when, cur };\n  };\n  const bestMarksHtml = `\n    <div class=\"card\" style=\"padding:14px;margin-bottom:12px;background:linear-gradient(135deg,#0f172a,#1e3a5f)\">\n      <div style=\"font-size:11px;color:#94a3b8;font-weight:600;letter-spacing:1px;text-transform:uppercase;margin-bottom:10px\">🏆 Suas melhores marcas (recordes)<\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:8px\">\n        ${recordDefs.map(d => { const m=bestMark(d.f, d.mode); if(!m) return ''; const isRec = m.best===m.cur;\n          return `<div style=\"background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:9px 11px\">\n            <div style=\"font-size:10px;color:#94a3b8\">${d.label}<\u002Fdiv>\n            <div style=\"font-size:19px;font-weight:800;color:${d.color}\">${m.best}${d.unit}<\u002Fdiv>\n            <div style=\"font-size:9px;color:#64748b\">recorde · ${m.when}${isRec ? ' · é agora 🔥' : ' · agora '+m.cur+d.unit}<\u002Fdiv>\n          <\u002Fdiv>`; }).join('')}\n      <\u002Fdiv>\n    <\u002Fdiv>`;\n\n  const deltaOf = (field) => {\n    const vals = allData.map(r=>r[field]).filter(v=>v!=null);\n    if(!vals.length) return null;\n    return { first: vals[0], cur: vals[vals.length-1], delta: Math.round((vals[vals.length-1]-vals[0])*10)/10 };\n  };\n  const deltaCell = (field, label, mode, big) => {\n    const d = deltaOf(field); if(!d) return '';\n    const good = mode==='min' ? d.delta<=0 : d.delta>=0;\n    const color = good ? '#22c55e' : '#fb923c';\n    const sign = d.delta>0 ? '+' : '';\n    const fs = big ? '20px' : '14px';\n    return `<div><div style=\"font-size:${fs};font-weight:800;color:${color}\">${sign}${d.delta}<\u002Fdiv><div style=\"font-size:10px;color:#94a3b8\">${label}<\u002Fdiv><\u002Fdiv>`;\n  };\n  const resumoHtml = `\n    <div class=\"card\" style=\"padding:14px;margin-bottom:12px;background:linear-gradient(135deg,#1e293b,#475569)\">\n      <div style=\"font-size:11px;color:#cbd5e1;font-weight:600;letter-spacing:1px;text-transform:uppercase;margin-bottom:10px\">📊 Diferença desde o início<\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;text-align:center\">\n        ${deltaCell('peso','kg peso','min',true)}\n        ${deltaCell('cintura','cm cintura','min',true)}\n        ${deltaCell('peito','cm peitoral','max',true)}\n      <\u002Fdiv>\n      <div style=\"margin-top:10px;padding-top:10px;border-top:1px solid rgba(255,255,255,.12);display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;text-align:center\">\n        ${deltaCell('braco','cm braço','max',false)}\n        ${deltaCell('quadril','cm quadril','min',false)}\n        ${deltaCell('abdome','cm abdome','min',false)}\n      <\u002Fdiv>\n    <\u002Fdiv>`;\n\n  return `\n    <div class=\"section-title\"><div class=\"ico\">📈<\u002Fdiv>\n      <h2>Histórico de Evolução<\u002Fh2>\n    <\u002Fdiv>\n\n    ${formHtml}\n\n    <div class=\"card\" style=\"margin-bottom:12px;background:#0f172a\">\n      <div style=\"font-size:14px;font-weight:700;color:#fff\">📤 Exportar medidas<\u002Fdiv>\n      <div style=\"margin-top:12px\">\n        <button onclick=\"exportMedidasCSV()\" style=\"width:100%;background:#fff;color:#0f172a;border-radius:10px;padding:11px;font-size:12px;font-weight:700\">⬇ Baixar CSV (planilha)<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    ${bestMarksHtml}\n    ${resumoHtml}\n\n    ${miniChart(allData, 'peso', '#3b82f6', 77, ' kg', '⚖️ Peso corporal')}\n    ${miniChart(allData, 'cintura', '#f97316', 77, ' cm', '📏 Cintura')}\n    ${miniChart(allData, 'abdome', '#ef4444', 80, ' cm', '📏 Abdome')}\n    ${miniChart(allData, 'pct', '#8b5cf6', 15, '%', '🧪 % Gordura')}\n    ${miniChart(allData, 'gorda', '#fb923c', 11.55, ' kg', '🔥 Massa Gorda (kg)')}\n    ${miniChart(allData, 'peito', '#0ea5e9', 105, ' cm', '💪 Peitoral')}\n    ${miniChart(allData, 'braco', '#10b981', 40, ' cm', '💪 Braço relaxado')}\n\n  `;\n}\n\nfunction addHistMed() {\n  const get = id => { const el = document.getElementById(id); return el ? el.value.trim() : ''; };\n  const d = get('h_data'); if (!d) { alert('Informe a data'); return; }\n  const med = {\n    d, \n    peso: parseFloat(get('h_peso'))||null,\n    cintura: parseFloat(get('h_cintura'))||null,\n    abdome: parseFloat(get('h_abdome'))||null,\n    quadril: parseFloat(get('h_quadril'))||null,\n    braco: parseFloat(get('h_braco'))||null,\n    peito: parseFloat(get('h_peito'))||null,\n    pct: parseFloat(get('h_pct'))||null,\n    gorda: null,\n  };\n  try {\n    const existing = JSON.parse(MEM['history_measurements'] || '[]');\n    existing.push(med);\n    save('history_measurements', JSON.stringify(existing));\n  } catch(e) { save('history_measurements', JSON.stringify([med])); }\n  render();\n}\n\nfunction clearHistMed() {\n  if (confirm('Apagar todas as medições adicionadas?')) { delete MEM['history_measurements']; persistStore(); render(); }\n}\n\nfunction exportMedidasJSON() {\n  const data = { atleta:'Wesley Lima da Silva', altura_cm:166, exportadoEm:new Date().toISOString(), totalMedidas:histExportData.length, medidas:histExportData };\n  ctDownload(JSON.stringify(data,null,2), 'medidas-wesley-'+ctTodayStr()+'.json', 'application/json');\n}\nfunction exportMedidasCSV() {\n  const cols=['d','peso','gorda','pct','cintura','abdome','quadril','braco','peito'];\n  const head=['data','peso_kg','massa_gorda_kg','pct_gordura','cintura_cm','abdome_cm','quadril_cm','braco_cm','peito_cm'];\n  const rows=histExportData.map(r=>cols.map(c=>r[c]==null?'':r[c]).join(','));\n  ctDownload(head.join(',')+'\\n'+rows.join('\\n'), 'medidas-wesley-'+ctTodayStr()+'.csv', 'text/csv');\n}\n\n// ─── TAB · EXECUÇÃO (registro de treino) ────────────────────────────\nconst CT_KEY = 'ct_workout_v1';\nlet ctData = { history: [], live: null, orders: {}, acts: {} };\n(function(){ try { const r = localStorage.getItem(CT_KEY); if (r) { const d = JSON.parse(r); ctData.history = d.history || []; ctData.live = d.live || null; ctData.orders = d.orders || {}; ctData.acts = d.acts || {}; } } catch(e) {} })();\nfunction ctPersist(){ try { localStorage.setItem(CT_KEY, JSON.stringify({ history: ctData.history, live: ctData.live, orders: ctData.orders, acts: ctData.acts })); } catch(e) {} }\n\nlet ctChartEx = null, ctDetailId = null;\nlet ctRest = { running:false, endAt:0, total:0, remaining:0 };\nlet ctTicker = null;\n\nconst CT_ORDER = ['fullA','fullB'];\nconst CT_META = {\n  fullA: { em:'🟦', short:'Full Body A', accent:'#3b82f6' },\n  fullB: { em:'🟩', short:'Full Body B', accent:'#10b981' },\n};\n\nfunction ctNum(v){ const n = parseFloat(String(v==null?'':v).replace(',','.')); return isFinite(n)?n:0; }\nfunction ctSetCount(sr){ const m = String(sr).match(/^(\\d+)/); return m?parseInt(m[1],10):3; }\nfunction ctIsTime(sr){ return /s\\b|seg/i.test(String(sr).split('×')[1]||''); }\nfunction ctRestSec(r){ const n=parseInt(String(r),10); return isFinite(n)?n:0; }\nfunction ctRelDays(ms){ const d = Math.floor((Date.now()-ms)/86400000); if(d<=0)return 'hoje'; if(d===1)return 'ontem'; return 'há '+d+' dias'; }\nfunction ctFmtDate(ms){ return new Date(ms).toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit',month:'short'}); }\nfunction ctTodayStr(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }\nfunction ctMMSS(s){ const m=Math.floor(s/60), x=s%60; return m+':'+String(x).padStart(2,'0'); }\nfunction ctTodaySession(){ return ({1:'fullA',4:'fullB'})[new Date().getDay()] || null; }\nfunction ctExName(i){ return SESSIONS[ctData.live.sessionId].ex[i].n; }\n\nfunction ctLastFor(name){ for(let i=ctData.history.length-1;i>=0;i--){ const w=ctData.history[i]; const e=(w.exercises||[]).find(x=>x.name===name); if(e) return {dateMs:w.dateMs, sets:e.sets}; } return null; }\nfunction ctLastTop(name){ const l=ctLastFor(name); if(!l) return null; const done=l.sets.filter(s=>s.done&&(s.kg>0||s.reps>0)); if(!done.length) return null; let b=done[0]; done.forEach(s=>{ if((s.kg||0)>(b.kg||0)) b=s; }); return {kg:b.kg,reps:b.reps,dateMs:l.dateMs}; }\nfunction ctMonthCount(){ const n=new Date(); return ctData.history.filter(w=>{ const d=new Date(w.dateMs); return d.getMonth()===n.getMonth()&&d.getFullYear()===n.getFullYear(); }).length; }\nfunction ctWeekCount(){ const d=new Date(); const day=(d.getDay()+6)%7; const monday=new Date(d.getFullYear(),d.getMonth(),d.getDate()-day).getTime(); return ctData.history.filter(w=>w.dateMs>=monday).length; }\n\n// re-render só o conteúdo, preservando o scroll (sem pular pro topo)\nfunction ctRefresh(){ const sc=window.scrollY; const el=document.getElementById('content'); if(el){ el.innerHTML=renderExec(); window.scrollTo(0,sc); } }\n\nfunction ctExOrder(){\n  const live=ctData.live; if(!live) return [];\n  const n=SESSIONS[live.sessionId].ex.length;\n  const def=Array.from({length:n},(_,i)=>i), o=live.order;\n  if(!Array.isArray(o)||o.length!==n) return def;\n  const seen={}; for(let k=0;k<o.length;k++){ const i=o[k]; if(typeof i!=='number'||i<0||i>=n||seen[i]) return def; seen[i]=1; }\n  return o;\n}\nfunction ctMoveEx(from,to){ const live=ctData.live; if(!live) return; const ord=ctExOrder().slice(); const m=ord.splice(from,1)[0]; ord.splice(to,0,m); live.order=ord; ctData.orders=ctData.orders||{}; ctData.orders[live.sessionId]=ord; ctPersist(); ctRefresh(); }\nfunction ctIsCol(ei){ const L=ctData.live; return !!(L && L.col && L.col[ei]); }\nfunction ctToggleCol(ei){ const L=ctData.live; if(!L) return; L.col=L.col||{}; if(L.col[ei]) delete L.col[ei]; else L.col[ei]=1; ctPersist(); ctRefresh(); }\nfunction ctColAll(v){ const L=ctData.live; if(!L) return; L.col={}; if(v) SESSIONS[L.sessionId].ex.forEach((e,i)=>{ L.col[i]=1; }); ctPersist(); const el=document.getElementById('content'); if(el){ el.innerHTML=renderExec(); window.scrollTo(0,0); } }\nfunction ctResetOrder(){ const live=ctData.live; if(!live) return; delete live.order; if(ctData.orders) delete ctData.orders[live.sessionId]; ctPersist(); ctRefresh(); }\nfunction ctProgSignal(name, sr){\n  const l=ctLastFor(name); if(!l) return null;\n  const done=l.sets.filter(x=>x.done && x.reps>0); if(!done.length) return null;\n  const topo=repTopo(sr); if(!topo) return null;\n  const kg=done[0].kg||0;\n  const todasNoTopo=done.every(x=>x.reps>=topo);\n  return { ok:todasNoTopo, kg:kg, topo:topo, reps:done.map(x=>x.reps) };\n}\nfunction ctLastNote(name){ for(let i=ctData.history.length-1;i>=0;i--){ const w=ctData.history[i]; const e=(w.exercises||[]).find(x=>x.name===name); if(e&&e.note) return {note:e.note,dateMs:w.dateMs}; } return null; }\n\nlet ctDrag=null;\nfunction ctDragStart(ev,handle){\n  const wrap=handle.closest('.ct-ex-wrap'); if(!wrap) return;\n  ev.preventDefault();\n  const wraps=Array.prototype.slice.call(document.querySelectorAll('.ct-ex-wrap'));\n  const rects=wraps.map(w=>w.getBoundingClientRect());\n  const idx=wraps.indexOf(wrap);\n  ctDrag={wraps:wraps,rects:rects,idx:idx,target:idx,startY:ev.clientY,h:rects[idx].height+10};\n  wrap.classList.add('dragging');\n  wrap.style.transition='none'; wrap.style.boxShadow='0 14px 34px rgba(15,23,42,.28)'; wrap.style.opacity='.97';\n  document.body.style.userSelect='none';\n  window.addEventListener('pointermove',ctDragMove,{passive:false});\n  window.addEventListener('pointerup',ctDragEnd);\n  window.addEventListener('pointercancel',ctDragEnd);\n}\nfunction ctDragMove(ev){\n  if(!ctDrag) return; ev.preventDefault();\n  const d=ctDrag, dy=ev.clientY-d.startY;\n  d.wraps[d.idx].style.transform='translateY('+dy+'px)';\n  const center=d.rects[d.idx].top+d.rects[d.idx].height/2+dy;\n  let target=d.idx;\n  for(let i=0;i<d.rects.length;i++){\n    if(i===d.idx) continue;\n    const c=d.rects[i].top+d.rects[i].height/2;\n    if(i<d.idx && center<c) target=Math.min(target,i);\n    if(i>d.idx && center>c) target=Math.max(target,i);\n  }\n  d.target=target;\n  for(let i=0;i<d.wraps.length;i++){\n    if(i===d.idx) continue;\n    let shift=0;\n    if(d.idx<target && i>d.idx && i<=target) shift=-d.h;\n    if(d.idx>target && i>=target && i<d.idx) shift=d.h;\n    d.wraps[i].style.transition='transform .15s ease';\n    d.wraps[i].style.transform=shift?('translateY('+shift+'px)'):'';\n  }\n}\nfunction ctDragEnd(){\n  if(!ctDrag) return; const d=ctDrag; ctDrag=null;\n  window.removeEventListener('pointermove',ctDragMove);\n  window.removeEventListener('pointerup',ctDragEnd);\n  window.removeEventListener('pointercancel',ctDragEnd);\n  document.body.style.userSelect='';\n  if(d.target!==d.idx){ ctMoveEx(d.idx,d.target); }\n  else { d.wraps.forEach(w=>{ w.classList.remove('dragging'); w.style.transform=''; w.style.transition=''; w.style.boxShadow=''; w.style.opacity=''; }); }\n}\ndocument.addEventListener('pointerdown',function(ev){ const t=ev.target; if(!t||!t.closest) return; const hnd=t.closest('.ct-drag'); if(hnd) ctDragStart(ev,hnd); },{passive:false});\n\nfunction ctStart(id){\n  if(!(ctData.live && ctData.live.sessionId===id)){\n    const sess=SESSIONS[id]; const ex={};\n    sess.ex.forEach(e=>{ const n=ctSetCount(e.sr);\n      ex[e.n]={ note:'', sets:Array.from({length:n},()=>({ kg:'', reps:'', done:false })) }; });\n    ctData.live={ sessionId:id, week:STATE.week, startedAt:Date.now(), ex };\n    const savedOrder=(ctData.orders||{})[id];\n    if(Array.isArray(savedOrder) && savedOrder.length===sess.ex.length) ctData.live.order=savedOrder.slice();\n  }\n  ctDetailId=null; ctPersist(); render();\n}\nfunction ctToggle(ei,si){\n  const live=ctData.live; if(!live) return; const name=ctExName(ei);\n  const s=live.ex[name].sets[si]; const was=s.done; s.done=!was; ctPersist(); ctRefresh();\n  if(!was){ const def=SESSIONS[live.sessionId].ex.find(e=>e.n===name); ctStartRest(ctRestSec(def.rest)); }\n}\nfunction ctSetField(ei,si,field,val){ const live=ctData.live; if(!live) return; live.ex[ctExName(ei)].sets[si][field]=val; ctPersist(); }\nfunction ctSetNote(ei,val){ const live=ctData.live; if(!live) return; live.ex[ctExName(ei)].note=val; ctPersist(); }\nfunction ctDiscard(){ if(!confirm('Descartar este treino? Os dados não serão salvos.')) return; ctData.live=null; ctSkipRest(); ctPersist(); render(); }\nfunction ctFinish(){\n  const live=ctData.live; if(!live) return; const sess=SESSIONS[live.sessionId];\n  const exercises=ctExOrder().map(ei=>{ const e=sess.ex[ei]; const l=live.ex[e.n]||{sets:[],note:''}; return {\n    name:e.n, target:e.sr, rest:e.rest, rir:e.rir, note:l.note||'',\n    sets:(l.sets||[]).map(s=>({ kg:ctNum(s.kg), reps:ctNum(s.reps), done:!!s.done })) }; });\n  const setsDone=exercises.reduce((a,e)=>a+e.sets.filter(s=>s.done).length,0);\n  if(setsDone===0){ if(!confirm('Nenhuma série marcada como feita. Descartar este treino?')) return; ctData.live=null; ctSkipRest(); ctPersist(); render(); return; }\n  const totalVolume=Math.round(exercises.reduce((a,e)=>a+e.sets.filter(s=>s.done).reduce((b,s)=>b+(s.kg*s.reps||0),0),0));\n  const durationMin=Math.max(1,Math.round((Date.now()-live.startedAt)/60000));\n  let dateMs=Date.now();\n  if(live.dateOverride){ const p=String(live.dateOverride).split('-'); if(p.length===3){ const dt=new Date(+p[0],+p[1]-1,+p[2],12,0,0); if(!isNaN(dt.getTime())) dateMs=dt.getTime(); } }\n  ctData.history.push({ id:Date.now(), dateMs:dateMs, date:new Date(dateMs).toISOString(), week:live.week, sessionId:live.sessionId, setsDone, totalVolume, durationMin, exercises });\n  ctData.history.sort((a,b)=>a.dateMs-b.dateMs);\n  ctData.live=null; ctSkipRest(); ctPersist(); render();\n}\n\n// Cronômetro de descanso\nfunction ctStartRest(sec){ if(!sec||sec<=0){ ctSkipRest(); return; } ctRest={ running:true, endAt:Date.now()+sec*1000, total:sec, remaining:sec }; ctShowRestBar(); if(!ctTicker) ctTicker=setInterval(ctTick,250); }\nfunction ctTick(){ if(!ctRest.running) return; const rem=Math.max(0,Math.round((ctRest.endAt-Date.now())/1000)); if(rem<=0){ ctRest.running=false; ctUpdateRestBar(0); ctBeep(); try{ navigator.vibrate && navigator.vibrate([300,120,300]); }catch(e){} ctHideRestBar(); } else if(rem!==ctRest.remaining){ ctRest.remaining=rem; ctUpdateRestBar(rem); } }\nfunction ctAddRest(){ if(!ctRest.running) return; ctRest.endAt+=15000; ctRest.total+=15; ctRest.remaining=Math.max(0,Math.round((ctRest.endAt-Date.now())/1000)); ctUpdateRestBar(ctRest.remaining); }\nfunction ctSkipRest(){ ctRest.running=false; ctHideRestBar(); }\nfunction ctShowRestBar(){ const b=document.getElementById('ctRestBar'); if(b){ b.classList.add('show'); ctUpdateRestBar(ctRest.remaining); } }\nfunction ctHideRestBar(){ const b=document.getElementById('ctRestBar'); if(b) b.classList.remove('show'); }\nfunction ctUpdateRestBar(rem){ const t=document.getElementById('ctRestTime'); if(t) t.textContent=ctMMSS(rem); const ring=document.getElementById('ctRestRing'); if(ring&&ctRest.total){ const elapsed=Math.max(0,Math.min(100,(1-rem/ctRest.total)*100)); ring.style.background='conic-gradient(#34d399 '+elapsed.toFixed(0)+'%, #334155 0)'; } }\nfunction ctBeep(){ try{ const AC=window.AudioContext||window.webkitAudioContext; const ac=new AC(); [0,0.18,0.36].forEach((t,i)=>{ const o=ac.createOscillator(),g=ac.createGain(); o.connect(g); g.connect(ac.destination); o.type='sine'; o.frequency.value=i===2?1100:880; g.gain.setValueAtTime(0.0001,ac.currentTime+t); g.gain.exponentialRampToValueAtTime(0.35,ac.currentTime+t+0.02); g.gain.exponentialRampToValueAtTime(0.0001,ac.currentTime+t+0.14); o.start(ac.currentTime+t); o.stop(ac.currentTime+t+0.16); }); }catch(e){} }\n\n// Gráfico de evolução de carga\nfunction ctChartNames(){ const set=new Set(); ctData.history.forEach(w=>(w.exercises||[]).forEach(e=>{ if(e.sets.some(s=>s.done&&s.kg>0)) set.add(e.name); })); return Array.from(set); }\nfunction ctChartPts(name){ const pts=[]; ctData.history.forEach(w=>{ const e=(w.exercises||[]).find(x=>x.name===name); if(e){ const tops=e.sets.filter(s=>s.done&&s.kg>0).map(s=>s.kg); if(tops.length) pts.push({x:w.dateMs,y:Math.max.apply(null,tops)}); } }); return pts; }\nfunction ctSetChart(i){ ctChartEx=ctChartNames()[i]; ctRefresh(); }\nfunction ctChartSVG(name){\n  const pt  if(btn){ const o=btn.textContent; btn.textContent='✓ Copiado!'; setTimeout(()=>{ btn.textContent=o; },1800); } }; try{ navigator.clipboard.writeText(md).then(ok,()=>ctFallbackCopy(md,ok)); }catch(e){ ctFallbackCopy(md,ok); } }\n\n// Render\nfunction renderExec(){ if(ctDetailId) return ctRenderDetail(); if(ctData.live) return ctRenderSheet(); return ctRenderHome(); }\n\nfunction ctRenderSheet(){\n  const live=ctData.live, sess=SESSIONS[live.sessionId], m=CT_META[live.sessionId], phase=getPhase(live.week);\n  let total=0, done=0;\n  const order=ctExOrder();\n  const exHtml=order.map((ei,pos)=>{\n    const e=sess.ex[ei];\n    const l=live.ex[e.n]||{sets:[],note:''};\n    const sets=l.sets||[];\n    const nd=sets.filter(x=>x.done).length;\n    total+=sets.length; done+=nd;\n    const col=ctIsCol(ei);\n    const badges=(e.cad||e.amp||e.bi)?('<div style=\"display:flex;gap:5px;flex-wrap:wrap;margin-top:6px\">'\n      +(e.bi?'<span style=\"font-size:9px;font-weight:800;color:#7c3aed;background:#f5f3ff;border:1px solid #ddd6fe;padding:3px 7px;border-radius:999px\">BISÉRIE '+e.bi+'<\u002Fspan>':'')\n      +(e.cad?'<span style=\"font-size:9px;font-weight:700;color:#15803d;background:#f0fdf4;border:1px solid #bbf7d0;padding:3px 7px;border-radius:999px\">🟢 CADEIA FECHADA<\u002Fspan>':'')\n      +(e.amp?'<span style=\"font-size:9px;font-weight:700;color:#b45309;background:#fffbeb;border:1px solid #fde68a;padding:3px 7px;border-radius:999px\">⚠️ MÁX. 90°<\u002Fspan>':'')\n      +'<\u002Fdiv>'):'';\n\n    const head='<div class=\"head\" style=\"align-items:center;gap:6px\">'\n      +'<span class=\"ct-drag\">⠿<\u002Fspan>'\n      +'<span class=\"num\">'+(pos+1)+'.<\u002Fspan>'\n      +'<span class=\"name\" onclick=\"ctToggleCol('+ei+')\" style=\"flex:1;cursor:pointer\">'+h(e.n)+(e.star?' ⭐':'')+'<\u002Fspan>'\n      +'<span style=\"flex-shrink:0;font-size:11px;font-weight:800;color:'+(nd===sets.length&&sets.length?'#15803d':'#94a3b8')+';background:'+(nd===sets.length&&sets.length?'
