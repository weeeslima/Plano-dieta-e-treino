p { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }\n  .week-banner .top .ph { font-size: 16px; font-weight: 700; }\n  .week-banner .instr { font-size: 12px; margin-bottom: 8px; }\n  .week-banner .techs { display: flex; gap: 6px; flex-wrap: wrap; }\n  .week-banner .techs span { font-size: 11px; background: #fff; padding: 2px 8px; border-radius: 999px; border: 1px solid #e2e8f0; color: #334155; font-weight: 600; }\n  .week-banner .techs span.muted { color: #94a3b8; font-weight: 400; }\n  .week-grid button { padding: 10px 0; border-radius: 8px; font-size: 12px; font-weight: 700; transition: all .15s; }\n  .week-grid button.current { background: #1e293b; color: #fff; box-shadow: 0 0 0 2px #1e293b; }\n  .week-grid button.b { background: #dbeafe; color: #1d4ed8; }\n  .week-grid button.o { background: #ffedd5; color: #c2410c; }\n  .week-grid button.r { background: #fee2e2; color: #b91c1c; }\n  .week-grid button.g { background: #d1fae5; color: #047857; }\n  .week-grid button.v { background: #ede9fe; color: #6d28d9; }\n  .legend { display: flex; gap: 6px; justify-content: space-between; flex-wrap: wrap; font-size: 10px; color: #64748b; margin-top: 8px; }\n  .legend span { display: flex; align-items: center; gap: 4px; }\n  .legend i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; }\n\n  /* Day list (training calendar) */\n  .day { width: 100%; display: flex; gap: 10px; align-items: center; background: #f8fafc; border-radius: 12px; padding: 8px 12px; margin-bottom: 6px; text-align: left; transition: all .15s; }\n  .day.clickable:active { background: #e2e8f0; }\n  .day.active { box-shadow: 0 0 0 2px #1e293b; }\n  .day.off { opacity: .65; }\n  .day .em { font-size: 16px; }\n  .day .d { font-size: 12px; font-weight: 700; color: #334155; }\n  .day .t { font-size: 11px; color: #64748b; }\n\n  /* Session tabs */\n  .sess-tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 12px; }\n  .sess-tabs button { padding: 8px 0; border-radius: 8px; background: #f1f5f9; color: #64748b; transition: all .15s; }\n  .sess-tabs button.active { background: #1e293b; color: #fff; }\n  .sess-tabs button .em { font-size: 16px; line-height: 1; }\n  .sess-tabs button .d { font-size: 10px; font-weight: 600; margin-top: 3px; }\n  .sess-hdr { padding-bottom: 8px; margin-bottom: 10px; border-bottom: 1px solid #f1f5f9; }\n  .sess-hdr .l { font-size: 15px; font-weight: 700; color: #1e293b; }\n  .sess-hdr .s { font-size: 11px; color: #64748b; }\n\n  /* Misc */\n  .footer-note { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 16px; padding: 14px; font-size: 11px; color: #94a3b8; text-align: center; margin-top: 8px; }\n\n  /* Install hint */\n  .install-hint { position: fixed; bottom: 16px; right: 16px; background: #1e293b; color: #fff; font-size: 11px; padding: 8px 12px; border-radius: 999px; box-shadow: 0 4px 12px rgba(0,0,0,.15); display: none; z-index: 100; cursor: pointer; }\n  .install-hint.show { display: block; }\n  @media (display-mode: standalone) { .install-hint { display: none !important; } }\n\n  /* Execução */\n  .ct-set-row { display: grid; grid-template-columns: 24px 1fr 1fr 46px; gap: 7px; align-items: center; margin-bottom: 6px; padding: 3px 2px; }\n  .ct-inp { width: 100%; height: 42px; border: 1.5px solid #e2e8f0; border-radius: 10px; text-align: center; font-size: 15px; font-weight: 700; color: #1e293b; background: #fff; }\n  .ct-inp:focus { outline: none; border-color: #0f172a; }\n  .ct-check { width: 46px; height: 42px; border-radius: 10px; border: 2px solid #e2e8f0; background: #fff; color: #cbd5e1; font-size: 18px; font-weight: 800; display: flex; align-items: center; justify-content: center; }\n  .ct-check.done { background: #10b981; border-color: #10b981; color: #fff; }\n  .ct-rest { position: fixed; left: 50%; transform: translateX(-50%); bottom: 0; width: 100%; max-width: 600px; z-index: 200; padding: 0 12px calc(12px + env(safe-area-inset-bottom)); display: none; }\n  .ct-rest.show { display: block; }\n  .ct-rest-inner { background: #0f172a; color: #fff; border-radius: 16px; padding: 12px 14px; display: flex; align-items: center; gap: 12px; box-shadow: 0 10px 30px rgba(15,23,42,.3); }\n  .ct-rest-ring { width: 46px; height: 46px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: conic-gradient(#34d399 0%, #334155 0); }\n  .ct-rest-ring-in { width: 36px; height: 36px; border-radius: 50%; background: #0f172a; display: flex; align-items: center; justify-content: center; font-size: 14px; }\n  .ct-rest-btn { border-radius: 10px; padding: 10px 13px; font-size: 12px; font-weight: 700; }\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n<div class=\"app\">\n  <header class=\"hdr\">\n    <div class=\"eyebrow\">Plano de Saúde Completo<\u002Fdiv>\n    <h1>Wesley Lima da Silva<\u002Fh1>\n    <div class=\"meta\">\n      <span>28 anos<\u002Fspan><span>·<\u002Fspan>\n      <span>1,65 m · 93 kg<\u002Fspan><span>·<\u002Fspan>\n      <span class=\"imc\">IMC 34,2<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fheader>\n  <nav class=\"tabs\"><div class=\"tabs-inner\" id=\"tabs\"><\u002Fdiv><\u002Fnav>\n  <main class=\"content\" id=\"content\"><\u002Fmain>\n<\u002Fdiv>\n<div class=\"install-hint\" id=\"installHint\">📲 Toque \"Compartilhar\" → \"Adicionar à Tela de Início\"<\u002Fdiv>\n<div class=\"ct-rest\" id=\"ctRestBar\">\n  <div class=\"ct-rest-inner\">\n    <div class=\"ct-rest-ring\" id=\"ctRestRing\"><div class=\"ct-rest-ring-in\">⏱<\u002Fdiv><\u002Fdiv>\n    <div style=\"flex:1;min-width:0\">\n      <div style=\"font-size:10px;color:#94a3b8;text-transform:uppercase;letter-spacing:1px\">Descanso<\u002Fdiv>\n      <div id=\"ctRestTime\" style=\"font-size:24px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums\">0:00<\u002Fdiv>\n    <\u002Fdiv>\n    <button class=\"ct-rest-btn\" onclick=\"ctAddRest()\" style=\"background:#1e293b;color:#fff\">+15s<\u002Fbutton>\n    <button class=\"ct-rest-btn\" onclick=\"ctSkipRest()\" style=\"background:#34d399;color:#053a2a\">Pular<\u002Fbutton>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<script>\n'use strict';\n\n// ─── State + storage ────────────────────────────────────────────────\n// Salvamento real no aparelho (localStorage) com fallback em memória\nconst STORE_KEY = 'plano_wesley_v1';\nlet MEM = {};\ntry { MEM = JSON.parse(localStorage.getItem(STORE_KEY) || '{}') || {}; } catch(e) { MEM = {}; }\nfunction persistStore() { try { localStorage.setItem(STORE_KEY, JSON.stringify(MEM)); } catch(e) {} }\nfunction load(k, def) { return Object.prototype.hasOwnProperty.call(MEM, k) ? MEM[k] : def; }\nfunction save(k, v) { MEM[k] = String(v); persistStore(); }\nconst STATE = {\n  tab: load('tab', 'analysis'),\n  dayType: load('dayType', 'treino'),\n  week: parseInt(load('week', '1'), 10) || 1,\n  session: load('session', 'upperA'),\n};\nfunction set(k, v) { STATE[k] = v; save(k, v); render(); }\n\n// ─── Helpers ────────────────────────────────────────────────────────\nconst h = (s) => s == null ? '' : String(s).replace(/[&<>\"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]));\nconst card = (inner) => `<div class=\"card\">${inner}<\u002Fdiv>`;\nconst sectionTitle = (ico, title, sub) => `<div class=\"section-title\"><div class=\"ico\">${ico}<\u002Fdiv><h2>${h(title)}<\u002Fh2><div class=\"sub\">${h(sub)}<\u002Fdiv><\u002Fdiv>`;\nconst tag = (label, color) => `<span class=\"tag ${color}\">${h(label)}<\u002Fspan>`;\nconst row = (lbl, val, accent, sub) => `<div class=\"row\"><span class=\"lbl\">${h(lbl)}<\u002Fspan><div class=\"val ${accent ? 'accent-'+accent : ''}\">${h(val)}${sub ? `<div class=\"sub\">${h(sub)}<\u002Fdiv>` : ''}<\u002Fdiv><\u002Fdiv>`;\n\nconst TABS = [\n  { id: 'analysis', em: '🔬', label: 'Análise' },\n  { id: 'diet', em: '🥗', label: 'Dieta' },\n  { id: 'training', em: '💪', label: 'Treino' },\n  { id: 'exec', em: '🏋️', label: 'Execução' },\n  { id: 'supps', em: '💊', label: 'Suplementos' },\n  { id: 'lifestyle', em: '🌿', label: 'Rotina' },\n  { id: 'tracking', em: '📅', label: 'Seguimento' },\n  { id: 'history', em: '📈', label: 'Histórico' },\n];\n\n// ─── TAB 1 · ANÁLISE ────────────────────────────────────────────────\nfunction renderAnalysis() {\n  const top = [\n    { v: '93 kg', l: 'Peso atual' },\n    { v: '1,65 m', l: 'Altura' },\n    { v: '34,2', l: 'IMC', c: 'warn' },\n  ];\n  const bot = [\n    { v: '~31%', l: 'Gordura est.', c: 'warn' },\n    { v: '~64 kg', l: 'Massa magra' },\n    { v: '72–78 kg', l: 'Peso alvo', c: 'ok' },\n  ];\n  const achados = [\n    { dot: 'red', t: 'Glicemia borderline + A1C 5,7%', d: '100 mg/dL e A1C exatamente no limite. Sem intervenção, risco de pré-diabetes em 1–2 anos. Dieta low-glycemic + treino de força são o remédio.' },\n    { dot: 'orange', t: 'LDL em piora progressiva (103→111→118)', d: 'Saiu da faixa ótima. Colesterol não-HDL 140, acima do alvo. Dieta mediterrânea + fibras + ômega 3 são essenciais.' },\n    { dot: 'amber', t: 'Testosterona 363 ng/dL (terço inferior)', d: 'Normal para o laboratório, mas baixo para 28 anos. Perda de gordura, treino de força, sono 8h e eliminação de álcool elevam naturalmente.' },\n    { dot: 'blue', t: 'Fasciíte plantar esquerda', d: 'Confirmada por US em dez/25. Limita corrida e saltos. Protocolo adaptado com bike, natação, elíptico e reabilitação diária.' },\n    { dot: 'violet', t: 'Vitamina D oscilante (19→40→27)', d: 'Caiu novamente após normalizar. Suplementação contínua essencial — impacta testosterona, imunidade e inflamação.' },\n    { dot: 'rose', t: 'Vitamina C abaixo do ref (0,3 mg/dL)', d: 'Ingestão insuficiente de frutas frescas. Piora estresse oxidativo, imunidade e cicatrização da fáscia.' },\n  ];\n  const exames = [\n    { t: 'USG Abdome Total', d: 'Normal. Fígado, rins, pâncreas, baço, vesícula e bexiga sem alterações. Nenhum sinal de esteatose hepática.' },\n    { t: 'USG Tireoide + Doppler', d: 'Normal. Volume 11,8 cm³, sem nódulos, vascularização habitual. Compatível com TSH e T3/T4 normais.' },\n  ];\n  const metas = [\n    { t: '3 meses', c: 'blue', items: ['Perder 4–6 kg', 'Vit. C e D normalizadas', 'A1C < 5,6%', 'Dor na fáscia ≥ 50% menor'] },\n    { t: '6 meses', c: 'orange', items: ['Perder 8–12 kg total', 'LDL < 110, TG < 130', 'Glicose < 95 mg/dL', 'Fasciíte em remissão', 'Testosterona subindo'] },\n    { t: '12 meses', c: 'green', items: ['Peso 72–78 kg', 'Massa muscular visivelmente aumentada', 'Exames metabólicos normalizados', 'Capacidade aeróbica elevada'] },\n  ];\n\n  return sectionTitle('🔬', 'Análise do Quadro Atual', 'Baseada nos exames de mar/25, out/25, mai/26 + laudos de 26/05/2026') +\n    card(`<h3>Composição Estimada<\u002Fh3>\n      <div class=\"grid-3\">${top.map(x => `<div class=\"stat\"><div class=\"v ${x.c||''}\">${x.v}<\u002Fdiv><div class=\"l\">${x.l}<\u002Fdiv><\u002Fdiv>`).join('')}<\u002Fdiv>\n      <div class=\"grid-3 mt-2\">${bot.map(x => `<div class=\"stat sm\"><div class=\"v ${x.c||''}\">${x.v}<\u002Fdiv><div class=\"l\">${x.l}<\u002Fdiv><\u002Fdiv>`).join('')}<\u002Fdiv>\n      <div class=\"text-center\" style=\"font-size:11px;color:#94a3b8;margin-top:8px\">* Composição estimada pelo IMC (Deurenberg). Aguardando DEXA/BIA.<\u002Fdiv>`) +\n    card(`<h3>Achados que Guiam o Plano<\u002Fh3>\n      <div class=\"bullets\">${achados.map(a => `\n        <div class=\"bullet\"><div class=\"dot ${a.dot}\"><\u002Fdiv>\n        <div><div class=\"title\">${h(a.t)}<\u002Fdiv><div class=\"desc\">${h(a.d)}<\u002Fdiv><\u002Fdiv><\u002Fdiv>`).join('')}<\u002Fdiv>`) +\n    card(`<h3>Novos Laudos — 26/05/2026<\u002Fh3>\n      ${exames.map(e => `<div class=\"box green\" style=\"display:flex;gap:10px;margin-top:0;margin-bottom:8px\"><span style=\"font-size:16px\">✅<\u002Fspan><div><div style=\"font-weight:700\">${h(e.t)}<\u002Fdiv><div style=\"margin-top:2px\">${h(e.d)}<\u002Fdiv><\u002Fdiv><\u002Fdiv>`).join('')}`) +\n    card(`<h3>Metas por Horizonte<\u002Fh3>\n      <div style=\"display:flex;flex-direction:column;gap:10px\">${metas.map(m => `\n        <div style=\"background:#f8fafc;border-radius:12px;padding:10px\">${tag(m.t, m.c)}\n        <ul style=\"list-style:none;padding:0;margin-top:8px\">${m.items.map(t => `<li style=\"font-size:12px;color:#475569;padding:1px 0 1px 14px;position:relative\">◦ ${h(t)}<\u002Fli>`).join('')}<\u002Ful>\n        <\u002Fdiv>`).join('')}<\u002Fdiv>`);\n}\n\n// ─── TAB 2 · DIETA ──────────────────────────────────────────────────\nfunction renderDiet() {\n  const t = STATE.dayType;\n  const macros = t === 'treino'\n    ? { kcal: '1.950 kcal', p:'180g', c:'170g', g:'60g', pc:'37%', cc:'35%', gc:'28%' }\n    : { kcal: '1.700 kcal', p:'180g', c:'110g', g:'60g', pc:'42%', cc:'26%', gc:'32%' };\n\n  const meals = [\n    {\n      hora: '12:30', nome: 'Almoço — quebra de jejum', kcal: t==='treino'?'~750 kcal':'~700 kcal',\n      items: ['200g de proteína magra (rotação semanal)',\n        t==='treino' ? '6 col. sopa de arroz integral' : '4 col. sopa de arroz integral (carbo recuado)',\n        '1 concha de feijão — fibra e controle glicêmico',\n        'Legumes refogados no azeite (brócolis, cenoura, abobrinha)',\n        'Tomate + pimentão na salada (vit. C)'],\n      sup: '💊 Enzimas (início) · Cromo 200mcg · D3 4.000UI+K2 100mcg · Ômega 3 (2g EPA+DHA) · Cúrcuma 500mg+piperina · Vit. C 250mg'\n    },\n    {\n      hora: '16:00', nome: 'Lanche', kcal: '~400 kcal',\n      items: ['1 iogurte grego natural 170g (sem açúcar)',\n        '1 fruta de vit. C (laranja, kiwi, goiaba, acerola, morango)',\n        '1 punhado de castanhas/amêndoas (25g)'],\n      sup: '💊 Cúrcuma 500mg+piperina · Vit. C 250mg (2ª dose) — afastado do treino'\n    },\n    {\n      hora: '19:00', nome: 'Jantar — seu pré-treino', kcal: t==='treino'?'~650 kcal':'~600 kcal',\n      items: t==='treino' ? [\n        '180g de proteína magra',\n        '100g (peso seco) de macarrão com molho de tomate caseiro',\n        'Cenoura + abobrinha raladas dissolvidas no molho',\n        '⚡ Esse é o carbo que te sustenta nas 2h de treino',\n      ] : [\n        '180g de proteína magra',\n        'Legumes refogados à vontade',\n        'Apenas 2–3 col. de carbo (ou zero, trocando por legume)',\n        'Sem macarrão cheio — você está parado hoje',\n      ],\n      sup: '💊 Enzimas (início da refeição)'\n    },\n    {\n      hora: '22:30', nome: t==='treino'?'Pós-treino':'Whey (opcional)', kcal: '~150 kcal',\n      items: t==='treino' ? [\n        '1 dose de whey (~30g) batido só com água',\n        'Leve, perto do sono — só proteína',\n      ] : [\n        'Opcional: pule se não treinou',\n        'Use só se a proteína do dia ficou abaixo de 180g',\n      ],\n      sup: '💊 Creatina 5g · Inositol 2–4g (sono + insulina noturna)'\n    },\n  ];\n\n  const proteins = [\n    { dias: '2 dias', nome: 'Filé de frango grelhado', nota: 'Versátil — base do prep', c: 'blue' },\n    { dias: '1 dia', nome: 'Carne moída magra (patinho 90/10)', nota: 'Hambúrguer caseiro OU bolonhesa', c: 'orange' },\n    { dias: '1–2 dias', nome: 'Bisteca suína magra', nota: 'Assada no forno', c: 'purple' },\n    { dias: '1 dia', nome: 'Fígado acebolado', nota: 'Ferro heme + B12 — funcional p/ microcitose', c: 'red' },\n  ];\n\n  const prep = [\n    'Arroz integral — panela cheia, porcionar em potes',\n    'Feijão — idem',\n    'Molho de tomate com legumes (cenoura + abobrinha raladas)',\n    'Frango e bisteca grelhados/assados em lote e porcionados',\n    'Moída e fígado: deixar separados (cozinham em ~8 min)',\n    'Bandeja de legumes assados (brócolis, cenoura, abobrinha)',\n  ];\n\n  return sectionTitle('🥗', 'Protocolo Nutricional', 'Déficit afiado, ciclagem de carbo, janela com jejum 16:8') +\n    card(`<h3>Base Calórica (Mifflin-St Jeor)<\u002Fh3>\n      ${row('TMB real', '~1.826 kcal', null, 'recalibrada — perfil escritório')}\n      ${row('TDEE manutenção', '~2.350–2.400 kcal', null, 'sedentário + treino 4× + futebol')}\n      ${row('Déficit médio', '~520 kcal/dia', 'orange')}\n      ${row('Projeção', '~0,5 kg gordura/sem', 'green', 'meta ~10–14 kg até dez')}\n      <div class=\"toggle\">\n        <button data-act=\"setDayType\" data-val=\"treino\" class=\"${t==='treino'?'active':''}\">💪 Treino (5×/sem)<\u002Fbutton>\n        <button data-act=\"setDayType\" data-val=\"descanso\" class=\"${t==='descanso'?'active':''}\">😴 Descanso (2×/sem)<\u002Fbutton>\n      <\u002Fdiv>\n      <div class=\"stat mt-3\" style=\"padding:14px\">\n        <div class=\"v\" style=\"font-size:22px\">${macros.kcal}<\u002Fdiv>\n        <div class=\"grid-3 mt-2\">\n          <div class=\"stat\" style=\"background:#fff\"><div class=\"l\">🥩 Proteína<\u002Fdiv><div style=\"font-weight:700;font-size:13px\">${macros.p}<\u002Fdiv><div class=\"l\">${macros.pc}<\u002Fdiv><\u002Fdiv>\n          <div class=\"stat\" style=\"background:#fff\"><div class=\"l\">🌾 Carbo<\u002Fdiv><div style=\"font-weight:700;font-size:13px\">${macros.c}<\u002Fdiv><div class=\"l\">${macros.cc}<\u002Fdiv><\u002Fdiv>\n          <div class=\"stat\" style=\"background:#fff\"><div class=\"l\">🥑 Gordura<\u002Fdiv><div style=\"font-weight:700;font-size:13px\">${macros.g}<\u002Fdiv><div class=\"l\">${macros.gc}<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-size:11px;color:#94a3b8;margin-top:8px\">Proteína e gordura fixas todo dia · só o carbo cicla<\u002Fdiv>\n      <\u002Fdiv>`) +\n    card(`<h3>⏱️ Janela Alimentar<\u002Fh3>\n      <div style=\"font-size:12px;color:#475569;line-height:1.5\">Jejum intencional <strong>16:8<\u002Fstrong> — 1ª refeição às 12:30, última às 19:00, whey pós às 22:30. Encaixa na sua rotina e ajuda a sensibilidade à insulina no conjunto. O que move o A1C é a perda de gordura + qualidade do carbo, não o jejum sozinho.<\u002Fdiv>`) +\n    card(`<h3>Refeições — ${t==='treino' ? 'Dia de Treino' : 'Dia de Descanso'}<\u002Fh3>\n      ${meals.map(m => `<div class=\"meal\">\n        <div class=\"meal-hdr\"><div><span class=\"hora\">${m.hora} · <\u002Fspan><span class=\"name\">${h(m.nome)}<\u002Fspan><\u002Fdiv>${tag(m.kcal,'blue')}<\u002Fdiv>\n        <ul>${m.items.map(it => `<li>${h(it)}<\u002Fli>`).join('')}<\u002Ful>\n        ${m.sup ? `<div class=\"meal-sup\">${h(m.sup)}<\u002Fdiv>` : ''}\n      <\u002Fdiv>`).join('')}`) +\n    card(`<h3>🥩 Rotação Semanal de Proteínas<\u002Fh3>\n      <div style=\"display:flex;flex-direction:column;gap:8px\">${proteins.map(p => `\n        <div class=\"meal\" style=\"margin-bottom:0\">\n          <div class=\"meal-hdr\"><span class=\"name\">${h(p.nome)}<\u002Fspan>${tag(p.dias,p.c)}<\u002Fdiv>\n          <div style=\"font-size:11px;color:#64748b\">${h(p.nota)}<\u002Fdiv>\n        <\u002Fdiv>`).join('')}\n        <div class=\"box green\" style=\"margin-top:0\">🍔 Hambúrguer legítimo: carne moída magra na frigideira sem óleo, sem pão branco no dia a dia. A carne é a estrela e cabe nos 180g.<\u002Fdiv>\n      <\u002Fdiv>`) +\n    card(`<h3>🗓️ Prep de Domingo (~2h fecham a semana)<\u002Fh3>\n      <div class=\"chips\">${prep.map((p,i) => `<div class=\"chip numbered\"><span class=\"num\">${i+1}.<\u002Fspan> ${h(p)}<\u002Fdiv>`).join('')}<\u002Fdiv>\n      <div class=\"box blue\">Na semana você só monta o prato e esquenta. Whey e fruta são montagem zero.<\u002Fdiv>`) +\n    card(`<h3 class=\"colored orange\">🛵 Protocolo do Delivery (sua maior alavanca)<\u002Fh3>\n      <div style=\"font-size:12px;color:#475569;margin-bottom:8px\">Você pede ~4×/semana. Regra: escolher pela estrutura, não pela proibição.<\u002Fdiv>\n      <div class=\"box green\" style=\"margin-top:0\"><strong>✓ Mire:<\u002Fstrong> proteína grelhada + carbo + legume (frango c/ arroz e salada, marmita fit, churrasco simples, poke). Acerta o macro em ~90% dos cardápios.<\u002Fdiv>\n      <div class=\"box red\"><strong>✗ Evite:<\u002Fstrong> só gordura + farinha — fritura, pizza, lanche de pão grande, esfiha frita.<\u002Fdiv>\n      <div class=\"box slate\">Fim de semana mais solto está previsto. A média semanal embute folga; refeição livre no sábado não quebra nada.<\u002Fdiv>`) +\n    card(`<h3>🎯 Alvos de Fundo (embutidos)<\u002Fh3>\n      ${row('Fibra', '25–30 g/dia', null, 'feijão, legumes, frutas, integrais')}\n      ${row('Água', '~3,5 L/dia', null, '+500 mL em dia de treino')}\n      ${row('Vitamina C', 'Priorizar nas refeições', 'rose', 'seu nível está baixo (0,3)')}\n      ${row('NEAT', 'Meta 8.000+ passos', 'orange', 'hoje ~1.500 — ponto mais fraco')}`) +\n    `<div class=\"box amber\"><strong>⚠️ A balança dá a palavra final.<\u002Fstrong> Porções são ponto de partida calculado. Rode 2–3 semanas, acompanhe a tendência (não o dia a dia) e ajustamos. Valide com seu médico — perfil glicêmico e microcitose em investigação.<\u002Fdiv>`;\n}\n\n// ─── TAB 3 · TREINO ─────────────────────────────────────────────────\nconst SESSIONS = {\n  upperA: {\n    label: '🔵 Upper A', day: 'Segunda', sub: 'Ênfase peito + ombro · ~95 min',\n    ex: [\n      { n:'Supino reto com halteres', sr:'4×8–10', rest:'120s', rir:'2', note:'Halter > barra: melhor pro ombro e ADM' },\n      { n:'Supino inclinado na máquina (~30°)', sr:'3×10–12', rest:'90s', rir:'2', note:'Peito superior, ombro protegido' },\n      { n:'Crucifixo no cross (cabo médio)', sr:'3×12–15', rest:'75s', rir:'2', note:'Foco contração, pausa 1s no encurtado' },\n      { n:'Desenvolvimento na máquina sentado', sr:'4×8–10', rest:'120s', rir:'2', note:'Máquina > livre — postura preservada' },\n      { n:'Elevação lateral c/ halteres', sr:'4×12–15', rest:'60s', rir:'1', note:'Lateral dá a largura', tech:'drop' },\n      { n:'Remada baixa na máquina (pegada neutra)', sr:'3×10–12', rest:'90s', rir:'2', note:'Suporte — escápula + horizontalidade' },\n      { n:'Tríceps na corda (puxada)', sr:'3×12–15', rest:'60s', rir:'1', note:'Abrir corda no final', tech:'rest' },\n      { n:'Tríceps francês c/ halter (unilateral)', sr:'3×10–12', rest:'60s', rir:'1', note:'Cabeça longa alongada' },\n      { n:'Rosca direta na barra W', sr:'4×10–12', rest:'75s', rir:'2', note:'Manutenção — pesado é quinta' },\n    ],\n  },\n  lowerA: {\n    label: '🔴 Lower A', day: 'Terça', sub: 'PESADO · 84h até o futebol · ~90 min',\n    ex: [\n      { n:'Leg press 45° (pés altos)', sr:'4×10–12', rest:'150s', rir:'2', note:'Pé alto = mais glúteo, menos compressão patelar' },\n      { n:'Hack squat ou Smith', sr:'3×10–12', rest:'120s', rir:'2', note:'Até paralela, nunca abaixo. Joelho na linha do pé' },\n      { n:'Stiff com halteres', sr:'4×10–12', rest:'120s', rir:'2', note:'Joelho semi-flexionado fixo — zero estresse patelar' },\n      { n:'Cadeira flexora', sr:'3×12–15', rest:'75s', rir:'1', note:'Posterior isolado, pausa 1s no encurtado' },\n      { n:'Hip thrust com barra', sr:'3×10–12', rest:'90s', rir:'2', note:'Glúteo — motor da estabilização do joelho' },\n      { n:'Abdução de quadril sentado', sr:'3×15–20', rest:'60s', rir:'1', note:'Glúteo médio — estabilizador chave', tech:'drop' },\n      { n:'Panturrilha em pé na máquina', sr:'4×12–15', rest:'60s', rir:'1', note:'Toda a panturrilha da semana fica aqui' },\n      { n:'Prancha frontal', sr:'3×45–60s', rest:'45s', rir:'—', note:'Core estabilizador' },\n    ],\n  },\n  upperB: {\n    label: '🔵 Upper B', day: 'Quinta', sub: 'Costas + DIA DO BÍCEPS · ~100 min',\n    ex: [\n      { n:'Barra fixa assistida (Gravitron) ou puxada frontal aberta', sr:'4×8–10', rest:'120s', rir:'2', note:'Largura — dorsal alto · pegada pronada' },\n      { n:'Remada na máquina c/ peito apoiado (Hammer Row)', sr:'4×8–10', rest:'120s', rir:'2', note:'Espessura sem estresse lombar' },\n      { n:'Remada serrote com halter', sr:'3×10–12', rest:'90s', rir:'2', note:'Espessura unilateral do meio das costas' },\n      { n:'Pulldown unilateral no cabo (pegada neutra)', sr:'3×12–15', rest:'75s', rir:'1', note:'Dorsal unilateral, ADM completa' },\n      { n:'Crucifixo invertido na máquina', sr:'3×12–15', rest:'60s', rir:'1', note:'Deltóide posterior — o negligenciado', tech:'rest' },\n      { n:'Rosca scott com barra W', sr:'4×8–10', rest:'90s', rir:'1', note:'Bíceps em alongamento', tech:'rest', priority:true },\n      { n:'Rosca inclinada com halteres (banco 60°)', sr:'3×10–12', rest:'75s', rir:'1', note:'Estiramento da cabeça longa', priority:true },\n      { n:'Rosca martelo com halteres', sr:'3×10–12', rest:'60s', rir:'1', note:'Braquial — grossura do braço', tech:'drop', priority:true },\n      { n:'Tríceps francês na polia alta (corda)', sr:'3×10–12', rest:'75s', rir:'1', note:'Cabeça longa alongada' },\n      { n:'Supino reto na máquina (manutenção)', sr:'3×10–12', rest:'90s', rir:'2', note:'Pesado é segunda' },\n    ],\n  },\n  lowerB: {\n    label: '🟢 Lower B', day: 'Sexta', sub: 'LEVE · foot-friendly · ~75 min',\n    ex: [\n      { n:'Mesa flexora deitado', sr:'4×10–12', rest:'90s', rir:'2', note:'Posterior pesado, pé fora de carga' },\n      { n:'Stiff com halteres (leve)', sr:'3×12–15', rest:'90s', rir:'2', note:'Recuperação ativa do posterior' },\n      { n:'Cadeira flexora unilateral', sr:'3×12–15', rest:'60s', rir:'1', note:'Posterior isolado', tech:'drop' },\n      { n:'Hip thrust no banco com barra', sr:'3×10–12', rest:'90s', rir:'2', note:'Glúteo sem ficar em pé' },\n      { n:'Ponte de glúteo com banda', sr:'3×15–20', rest:'60s', rir:'1', note:'Glúteo médio + máximo, no chão' },\n      { n:'Leg press LEVE (50–60% da terça)', sr:'4×12–15', rest:'75s', rir:'2', note:'Quadríceps manutenção' },\n      { n:'Abdominal infra suspenso', sr:'3×12–15', rest:'60s', rir:'1', note:'Core sem carga no pé' },\n    ],\n  },\n};\n\nfunction getPhase(w) {\n  if (w <= 3) return { name:'Ramp-up técnico', weeks:'Sem. 1–3', instr:'Adicione +1 ao RIR de cada exercício', tech:[], cls:'blue' };\n  if (w <= 7) return { name:'Acumulação', weeks:'Sem. 4–7', instr:'Use o RIR alvo de cada exercício', tech:['drop'], cls:'orange' };\n  if (w <= 10) return { name:'Intensificação', weeks:'Sem. 8–10', instr:'Subtraia 1 do RIR se a forma permitir', tech:['drop','rest'], cls:'red' };\n  if (w === 11) return { name:'Deload', weeks:'Sem. 11', instr:'RIR 4 em todos · carga ~60%', tech:[], cls:'green' };\n  return { name:'Reset / Teste', weeks:'Sem. 12', instr:'Aferição: peso, fotos, cargas máximas seguras', tech:[], cls:'violet' };\n}\nconst weekClass = (w) => w<=3?'b':w<=7?'o':w<=10?'r':w===11?'g':'v';\nconst weekTagColor = (cls) => ({blue:'blue',orange:'orange',red:'red',green:'green',violet:'purple'})[cls];\n\nfunction techBadge(tech, phase) {\n  const isDrop = tech === 'drop';\n  const active = phase.tech.includes(tech);\n  const label = isDrop ? '🔻 Drop-set' : '⏸️ Rest-pause';\n  const desc = isDrop ? 'Última série: falha → reduz 30–40% peso → +6–10 reps'\n    : 'Última série: falha → 15s pausa → +3–5 reps → 15s pausa → +2–3 reps';\n  if (active) {\n    return `<div class=\"tech-badge active ${isDrop?'drop':'rest'}\">\n      <div class=\"tb-title\">${label} · ATIVO esta semana<\u002Fdiv>\n      <div>${desc}<\u002Fdiv><\u002Fdiv>`;\n  }\n  return `<div class=\"tech-badge inactive\">${label} programado · inativo nesta fase<\u002Fdiv>`;\n}\n\nfunction renderTraining() {\n  const w = STATE.week;\n  const phase = getPhase(w);\n  const s = SESSIONS[STATE.session] || SESSIONS.upperA;\n\n  const days = [\n    { d:'Seg', t:'Upper A — peito/ombro', id:'upperA', em:'🔵' },\n    { d:'Ter', t:'Lower A PESADO — quad + panturrilha', id:'lowerA', em:'🔴' },\n    { d:'Qua', t:'OFF — recuperação', id:null, em:'😴' },\n    { d:'Qui', t:'Upper B — costas + DIA DO BÍCEPS', id:'upperB', em:'🔵' },\n    { d:'Sex', t:'Lower B LEVE — posterior foot-friendly', id:'lowerB', em:'🟢' },\n    { d:'Sáb', t:'Futebol — perna funcional', id:null, em:'⚽' },\n    { d:'Dom', t:'OFF — caminhada 30min opcional', id:null, em:'😴' },\n  ];\n\n  const weekBtns = Array.from({length:12}, (_,i)=>i+1).map(wn => {\n    const cls = wn===w ? 'current' : weekClass(wn);\n    return `<button class=\"${cls}\" data-act=\"setWeek\" data-val=\"${wn}\">${wn}<\u002Fbutton>`;\n  }).join('');\n\n  const sessionTabs = [\n    { id:'upperA', em:'🔵', d:'Seg' },\n    { id:'lowerA', em:'🔴', d:'Ter' },\n    { id:'upperB', em:'🔵', d:'Qui' },\n    { id:'lowerB', em:'🟢', d:'Sex' },\n  ];\n\n  const nuncas = ['Supino c/ halteres','Supino inclinado máq.','Desenvolvimento máq.','Leg press','Hack squat / Smith','Stiff com halteres','Hip thrust','Barra fixa / puxada','Hammer Row','Remada baixa máq.','Mesa flexora','Remada serrote'];\n\n  return sectionTitle('💪', 'Planilha de Treino', 'Upper/Lower 4× · 12 semanas progressivas') +\n    `<div class=\"box amber\" style=\"margin-top:0;margin-bottom:12px\">\n      <div style=\"font-weight:700;color:#92400e;margin-bottom:4px\">⚠️ Restrições anotadas no desenho<\u002Fdiv>\n      <div>🦵 Condromalacia bilateral — sem extensora isolada, ADM controlada<\u002Fdiv>\n      <div>🦶 Fasciíte — panturrilha toda na terça (84h até o jogo)<\u002Fdiv>\n      <div>⚽ Futebol no sábado = lower funcional<\u002Fdiv>\n    <\u002Fdiv>` +\n    card(`<h3>📍 Onde Você Está<\u002Fh3>\n      <div class=\"week-banner ${phase.cls}\">\n        <div class=\"top\"><div class=\"ph\">Sem. ${w} · ${h(phase.name)}<\u002Fdiv>${tag(phase.weeks, weekTagColor(phase.cls))}<\u002Fdiv>\n        <div class=\"instr\">${h(phase.instr)}<\u002Fdiv>\n        <div class=\"techs\">${phase.tech.length===0\n          ? '<span class=\"muted\">Sem técnicas de intensidade<\u002Fspan>'\n          : phase.tech.map(t => `<span>${t==='drop'?'🔻 Drop-set ativo':'⏸️ Rest-pause ativo'}<\u002Fspan>`).join('')}<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"font-size:11px;color:#94a3b8;margin-bottom:6px\">Toque para mudar a semana:<\u002Fdiv>\n      <div class=\"grid-6 week-grid\">${weekBtns}<\u002Fdiv>\n      <div class=\"legend\">\n        <span><i style=\"background:#93c5fd\"><\u002Fi>Ramp-up<\u002Fspan>\n        <span><i style=\"background:#fdba74\"><\u002Fi>Acumul.<\u002Fspan>\n        <span><i style=\"background:#fca5a5\"><\u002Fi>Intens.<\u002Fspan>\n        <span><i style=\"background:#6ee7b7\"><\u002Fi>Deload<\u002Fspan>\n        <span><i style=\"background:#c4b5fd\"><\u002Fi>Teste<\u002Fspan>\n      <\u002Fdiv>`) +\n    card(`<h3>📅 Sua semana<\u002Fh3>\n      ${days.map(x => `<button class=\"day ${x.id?'clickable':'off'} ${x.id===STATE.session?'active':''}\" ${x.id?`data-act=\"setSession\" data-val=\"${x.id}\"`:'disabled'}>\n        <span class=\"em\">${x.em}<\u002Fspan><div><div class=\"d\">${x.d}<\u002Fdiv><div class=\"t\">${h(x.t)}<\u002Fdiv><\u002Fdiv>\n      <\u002Fbutton>`).join('')}\n      <div style=\"text-align:center;font-size:11px;color:#94a3b8;margin-top:8px\">↑ Toque um dia de treino para ver a planilha<\u002Fdiv>`) +\n    card(`<div class=\"sess-tabs\">\n        ${sessionTabs.map(b => `<button data-act=\"setSession\" data-val=\"${b.id}\" class=\"${STATE.session===b.id?'active':''}\">\n          <div class=\"em\">${b.em}<\u002Fdiv><div class=\"d\">${b.d}<\u002Fdiv><\u002Fbutton>`).join('')}\n      <\u002Fdiv>\n      <div class=\"sess-hdr\"><div class=\"l\">${h(s.label)} · ${h(s.day)}<\u002Fdiv><div class=\"s\">${h(s.sub)}<\u002Fdiv><\u002Fdiv>\n      ${s.ex.map((e,i) => `<div class=\"ex ${e.priority?'priority':''}\">\n        ${e.priority?'<div class=\"prio-tag\">🔴 Bíceps prioritário<\u002Fdiv>':''}\n        <div class=\"head\"><span class=\"num\">${i+1}.<\u002Fspan><span class=\"name\">${h(e.n)}<\u002Fspan><\u002Fdiv>\n        <div class=\"note\">${h(e.note)}<\u002Fdiv>\n        <div class=\"stats\">\n          <div class=\"stat-mini\"><div class=\"k\">Séries<\u002Fdiv><div class=\"v\">${h(e.sr)}<\u002Fdiv><\u002Fdiv>\n          <div class=\"stat-mini\"><div class=\"k\">Rest<\u002Fdiv><div class=\"v\">${h(e.rest)}<\u002Fdiv><\u002Fdiv>\n          <div class=\"stat-mini\"><div class=\"k\">RIR<\u002Fdiv><div class=\"v\">${h(e.rir)}<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        ${e.tech ? techBadge(e.tech, phase) : ''}\n      <\u002Fdiv>`).join('')}`) +\n    card(`<h3 class=\"colored red\">🚫 Nunca aplicar técnica de intensidade<\u002Fh3>\n      <div style=\"font-size:12px;color:#475569;margin-bottom:8px\">Compostos pesados (posições 1–4). Só progressão de carga.<\u002Fdiv>\n      <div class=\"grid-2\">${nuncas.map(n => `<div class=\"chip bad\">✗ ${h(n)}<\u002Fdiv>`).join('')}<\u002Fdiv>`) +\n    card(`<h3>🔥 Aquecimento — 8 min<\u002Fh3>\n      <div class=\"chips\">\n        ${['5 min bike ergométrica leve (zona 2)','Upper: rotação de ombro c/ banda 2×15','Lower: mobilidade quadril 90/90 + leg swings 2×10','Aproximação no 1º ex: 50%×8 → 70%×5 → 85%×3 → trabalho'].map((it,i) => `<div class=\"chip numbered\"><span class=\"num\">${i+1}.<\u002Fspan>${h(it)}<\u002Fdiv>`).join('')}\n      <\u002Fdiv>\n      <div class=\"box amber\">🦶 Antes/depois: protocolo da fasciíte (alongamento + bolinha) — aba Rotina<\u002Fdiv>`) +\n    card(`<h3>📝 Registro de progressão<\u002Fh3>\n      <div style=\"font-size:12px;color:#475569;margin-bottom:8px\">Sem registro a planilha morre. Anote: exercício, carga, reps, RIR, sono (1–10), dor na fáscia (0–10).<\u002Fdiv>\n      <div class=\"box blue\"><strong>Progressão:<\u002Fstrong> completou as séries no RIR alvo com técnica intacta? +2,5 kg (compostos) ou +1–2 reps (isolados) na próxima.<\u002Fdiv>\n      <div class=\"box slate\">Apps: <strong>Strong<\u002Fstrong>, <strong>Hevy<\u002Fstrong>, <strong>FitNotes<\u002Fstrong><\u002Fdiv>`) +\n    `<div class=\"box amber\"><strong>⚠️ Honestidade técnica:<\u002Fstrong> ajustes são esperados. Se algum exercício incomodar joelho/ombro, trocamos por variação equivalente. Fisio/orto nas primeiras 2–3 semanas é o que protege o joelho.<\u002Fdiv>`;\n}\n\n// ─── TAB 4 · SUPLEMENTOS ────────────────────────────────────────────\nfunction renderSupps() {\n  // Cronograma diário — Fase 1\n  const slots = [\n    {\n      hora: '12:30', nome: 'Almoço',\n      sups: [\n        { n:'Enzimas digestivas', d:'1 cáp', note:'Com o início da refeição (não 30 min antes)' },\n        { n:'Picolinato de cromo', d:'200 mcg', note:'Sensibilidade insulínica — refeição com mais carbo do dia' },\n        { n:'Vit. D3 + K2 MK-7', d:'4.000 UI + 100 mcg', note:'Lipossolúvel — precisa da gordura do almoço' },\n        { n:'Ômega 3', d:'2 g EPA+DHA', note:'Forma TG > EE · refrigerar após aberto' },\n        { n:'Cúrcuma (1ª)', d:'500 mg', note:'Com piperina (pimenta-preta moída na hora) OU Meriva/Theracurmin' },\n        { n:'Vitamina C (1ª)', d:'250 mg', note:'Dose fracionada — absorção saturada acima de ~200mg' },\n      ]\n    },\n    {\n      hora: '16:00', nome: 'Lanche',\n      sups: [\n        { n:'Cúrcuma (2ª)', d:'500 mg', note:'Afastada do treino — antioxidante atenua adaptação aguda' },\n        { n:'Vitamina C (2ª)', d:'250 mg', note:'2ª metade da dose · longe do treino noturno' },\n      ]\n    },\n    {\n      hora: '19:00', nome: 'Jantar',\n      sups: [\n        { n:'Enzimas digestivas', d:'1 cáp', note:'Refeição com 180g de proteína' },\n      ]\n    },\n    {\n      hora: '22:30', nome: 'Pós-treino / antes de dormir',\n      sups: [\n        { n:'Creatina monoidratada', d:'5 g', note:'Não precisa loading · não ciclar · todo dia, inclusive descanso' },\n        { n:'Inositol (Myo)', d:'2–4 g', note:'Melhora sono + sensibilidade insulínica noturna' },\n      ]\n    },\n  ];\n\n  return sectionTitle('💊', 'Protocolo de Suplementação', 'Fase 1 ativa · 8 suplementos · timing otimizado para treino noturno') +\n    `<div class=\"box amber\" style=\"margin-top:0;margin-bottom:12px\">\n      <strong>Princípios que organizam o cronograma:<\u002Fstrong><br/>\n      <span style=\"font-size:11px\">① Lipossolúveis (D3+K2, Ômega 3, Cúrcuma) precisam de gordura — almoço/lanche · ② Vit. C tem absorção saturada por dose — fracionar entrega mais · ③ Antioxidantes (Vit. C, Cúrcuma) afastados do treino — não atrapalham a adaptação · ④ Inositol à noite — sono + insulina noturna · ⑤ Cromo na refeição com mais carbo<\u002Fspan>\n    <\u002Fdiv>` +\n    card(`<h3>🗓️ Cronograma Diário — Fase 1<\u002Fh3>\n      ${slots.map(slot => `\n        <div class=\"meal\">\n          <div class=\"meal-hdr\">\n            <div><span class=\"hora\">${slot.hora} · <\u002Fspan><span class=\"name\">${h(slot.nome)}<\u002Fspan><\u002Fdiv>\n            ${tag(slot.sups.length + (slot.sups.length===1?' suplemento':' suplementos'), 'blue')}\n          <\u002Fdiv>\n          ${slot.sups.map(x => `\n            <div style=\"background:#fff;border-radius:8px;padding:8px 10px;margin-top:6px;border-left:3px solid #34d399\">\n              <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:8px\">\n                <span style=\"font-size:12px;font-weight:600;color:#1e293b\">${h(x.n)}<\u002Fspan>\n                <span style=\"font-size:12px;font-weight:700;color:#059669;white-space:nowrap\">${h(x.d)}<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"font-size:10px;color:#64748b;margin-top:2px;line-height:1.4\">${h(x.note)}<\u002Fdiv>\n            <\u002Fdiv>\n          `).join('')}\n        <\u002Fdiv>\n      `).join('')}`) +\n    card(`<h3>📋 Stack Resumida<\u002Fh3>\n      ${row('Total de suplementos', '8', 'green', 'Fase 1 ativa')}\n      ${row('Picolinato de cromo', '200 mcg · almoço')}\n      ${row('Inositol (Myo)', '2–4 g · pós-treino')}\n      ${row('Vitamina C', '500 mg/dia em 2× 250mg', null, 'almoço + lanche')}\n      ${row('Vit. D3 + K2 MK-7', '4.000 UI + 100 mcg · almoço')}\n      ${row('Ômega 3 (EPA+DHA)', '2 g · almoço')}\n      ${row('Cúrcuma', '1 g/dia em 2× 500mg', null, 'almoço + lanche, com piperina')}\n      ${row('Creatina monoidratada', '5 g · pós-treino')}\n      ${row('Enzimas digestivas', '1 cáp · almoço + jantar')}`) +\n    card(`<h3 class=\"colored violet\">🔄 Transição para Fase 2 — Berberina (futuro)<\u002Fh3>\n      <div style=\"font-size:12px;color:#475569;line-height:1.5;margin-bottom:10px\">\n        Quando? Idealmente <strong>após os exames de 3 meses<\u002Fstrong> (glicose, A1C, lipídico), com aval do seu médico — berberina tem interações medicamentosas relevantes.\n      <\u002Fdiv>\n      <div class=\"box violet\" style=\"background:#f5f3ff;color:#6d28d9;border:1px solid #ddd6fe;margin-top:0\">\n        <strong>3 mudanças que vêm junto com a berberina:<\u002Fstrong><br/>\n        <span style=\"font-size:11px\">\n        ① <strong>Picolinato de cromo SAI<\u002Fstrong> — redundância mecanística (ambos miram sensibilidade insulínica)<br/>\n        ② <strong>Inositol vira opcional<\u002Fstrong> — pode manter só pelo sono em dose menor, ou descontinuar<br/>\n        ③ <strong>Berberina 500mg 30 min ANTES do almoço E do jantar<\u002Fstrong> — diferente do inositol, berberina precisa estar circulando antes do bolo alimentar (ativa AMPK)\n        <\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"margin-top:10px\">\n        <div style=\"font-size:11px;font-weight:700;color:#7c3aed;margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px\">Novo cronograma com berberina<\u002Fdiv>\n        ${row('12:00 (30min antes almoço)', 'Berberina 500 mg', 'violet')}\n        ${row('12:30 Almoço', 'Mesma stack, SEM cromo')}\n        ${row('16:00 Lanche', 'Sem mudança')}\n        ${row('18:30 (30min antes jantar)', 'Berberina 500 mg', 'violet')}\n        ${row('19:00 Jantar', 'Sem mudança')}\n        ${row('22:30 Pós-treino', 'Creatina · Inositol opcional')}\n      <\u002Fdiv>\n      <div class=\"box amber\" style=\"margin-top:10px\">\n        <strong>Ciclagem obrigatória:<\u002Fstrong> 8 semanas ON / 4 semanas OFF — preserva microbiota intestinal e força reavaliação periódica.\n      <\u002Fdiv>`) +\n    card(`<h3 class=\"colored amber\">⚙️ Detalhes técnicos que importam<\u002Fh3>\n      <div class=\"chips\">\n        <div class=\"chip amber\"><strong>Cúrcuma:<\u002Fstrong> sempre com piperina (pimenta-preta moída na hora) — aumenta absorção ~2.000×. Formulações premium (Meriva fosfolipídeo, Theracurmin nano) dispensam piperina, +30× absorção.<\u002Fdiv>\n        <div class=\"chip amber\"><strong>Ômega 3:<\u002Fstrong> refrigerar após aberto (oxida). Preferir forma <strong>TG (triglicerídeo)<\u002Fstrong> ao EE (éster etílico) — absorção bem melhor.<\u002Fdiv>\n        <div class=\"chip amber\"><strong>Enzimas digestivas:<\u002Fstrong> com o INÍCIO da refeição, não 30 min antes. Tomadas antes, chegam ao intestino antes do bolo alimentar e perdem função.<\u002Fdiv>\n        <div class=\"chip amber\"><strong>Creatina:<\u002Fstrong> não loading, não ciclar. 5g/dia satura em 3–4 sem. Timing irrelevante — só não pule dias.<\u002Fdiv>\n        <div class=\"chip amber\"><strong>Cirurgia futura?<\u002Fstrong> Cúrcuma e ômega 3 têm efeito antiagregante leve. Parar <strong>2 semanas antes<\u002Fstrong> de qualquer procedimento.<\u002Fdiv>\n      <\u002Fdiv>`) +\n    `<div class=\"box slate\">\n      <strong>⚠️ Sobre enzimas digestivas:<\u002Fstrong> evidência pra uso preventivo sem deficiência pancreática diagnosticada é fraca. Se está tomando por desconforto/inchaço, vale registrar o motivo pra revisão futura com seu médico — suas USGs de abdome vieram normais, então é pouco provável que seja algo sério, mas o uso contínuo merece um \"por quê\" documentado.\n    <\u002Fdiv>`;\n}\n\n// ─── TAB 5 · ROTINA ─────────────────────────────────────────────────\nfunction renderLifestyle() {\n  const sono = ['7,5–9h de sono por noite (ideal 8h)','Horário fixo dormir e acordar — inclusive fim de semana','Quarto escuro, frio (18–21°C), silencioso','Sem tela 45 min antes de dormir','Inositol antes de dormir: melhora entrada no sono','Evitar cafeína após 14h','Eliminar/minimizar álcool — prejudica sono e testosterona'];\n  const estresse = ['Respiração 4-7-8 nos momentos agudos (expira em 8s)','Meditação/mindfulness: 5–10 min/dia (Calm, Headspace, Insight Timer)','Caminhada ao ar livre: modulador de cortisol potente','Limitar notícias e redes sociais à noite','Tempo de lazer e hobbies — não é opcional'];\n  const neat = ['Meta: 8.000–10.000 passos/dia','Subir escadas em vez do elevador','Caminhar 10–15 min após as refeições — reduz glicemia pós-prandial','Estacionar mais longe, descer antes do destino','Pausa a cada 1h sentado: levantar e caminhar 5 min'];\n  const fascia = [\n    { t:'Calçado', d:'Palmilha ortopédica + tênis com suporte ao arco (New Balance 860, Brooks Adrenaline, ASICS Gel-Kayano).' },\n    { t:'Fisioterapia', d:'2× semana por 4–8 semanas: ultrassom, taping. ESWT (ondas de choque) se não melhorar em 6–8 semanas.' },\n    { t:'Em casa', d:'Nunca andar descalço em superfície dura. Sandálias com suporte (Birkenstock, Crocs ortopédico).' },\n  ];\n\n  return sectionTitle('🌿', 'Estilo de Vida', 'Sono, sol, estresse e hábitos — tão importantes quanto treino e dieta') +\n    card(`<h3 class=\"colored violet\">😴 Sono — Prioridade Máxima<\u002Fh3>\n      <div style=\"font-size:12px;color:#475569;margin-bottom:8px;line-height:1.5\">Sono é o maior regulador de testosterona, cortisol e insulina. Com testosterona no terço inferior (363 ng/dL), dormir bem é <strong>tão importante quanto o treino.<\u002Fstrong><\u002Fdiv>\n      <div class=\"chips\">${sono.map(s => `<div class=\"chip violet\">◆ ${h(s)}<\u002Fdiv>`).join('')}<\u002Fdiv>`) +\n    card(`<h3 class=\"colored amber\">☀️ Sol e Vitamina D<\u002Fh3>\n      <div style=\"font-size:12px;color:#475569;margin-bottom:8px\">Vitamina D caiu de 40 → 27 sem exposição solar consistente. O sol tem benefícios além da D: serotonina, ritmo circadiano, óxido nítrico.<\u002Fdiv>\n      <div class=\"box amber\" style=\"margin-top:0\"><strong>Meta:<\u002Fstrong> 15–20 min de sol direto nos braços e pernas, antes das 10h ou após 16h, sem protetor nesse período. Diário ou em dias alternados.<\u002Fdiv>`) +\n    card(`<h3 class=\"colored orange\">🧠 Estresse e Cortisol<\u002Fh3>\n      <div style=\"font-size:12px;color:#475569;margin-bottom:8px\">Estresse crônico → cortisol alto → suprime testosterona + piora glicemia + gordura abdominal (exatamente seu perfil).<\u002Fdiv>\n      <div class=\"chips\">${estresse.map(s => `<div class=\"chip warn\">◆ ${h(s)}<\u002Fdiv>`).join('')}<\u002Fdiv>`) +\n    card(`<h3 class=\"colored green\">🚶 NEAT — Movimento Diário<\u002Fh3>\n      <div style=\"font-size:12px;color:#475569;margin-bottom:8px\">Além do treino formal, o NEAT contribui 200–400 kcal extras de queima/dia em quem é ativo no cotidiano.<\u002Fdiv>\n      <div class=\"chips\">${neat.map(s => `<div class=\"chip ok\">◆ ${h(s)}<\u002Fdiv>`).join('')}<\u002Fdiv>`) +\n    card(`<h3 class=\"colored amber\">🦶 Cuidados com a Fasciíte<\u002Fh3>\n      ${fascia.map(x => `<div class=\"box amber\" style=\"margin-top:6px\"><strong>${h(x.t)}:<\u002Fstrong> ${h(x.d)}<\u002Fdiv>`).join('')}`) +\n    card(`<h3 class=\"colored red\">🍷 Álcool<\u002Fh3>\n      <div style=\"font-size:12px;color:#475569\">Álcool eleva triglicérides, prejudica o fígado, suprime testosterona (até 25% por 24h), interfere no sono profundo e adiciona calorias vazias.<\u002Fdiv>\n      <div class=\"box red\"><strong>Recomendação:<\u002Fstrong> Eliminar ou limitar a máx 1–2 doses/semana nas primeiras 12 semanas. Após, reavalie com seus marcadores.<\u002Fdiv>`);\n}\n\n// ─── TAB 6 · SEGUIMENTO ─────────────────────────────────────────────\nfunction renderTracking() {\n  const metricas = [\n    { m:'Peso corporal', f:'1×/semana', n:'Mesma hora, em jejum, sem roupa. Observe a tendência semanal, não o valor diário.' },\n    { m:'Circunferência abdominal', f:'1×/mês', n:'Na altura do umbigo. Mais fiel que o peso para gordura visceral.' },\n    { m:'Braço + perna', f:'1×/mês', n:'Para monitorar ganho muscular durante o déficit.' },\n    { m:'Fotos comparativas', f:'1×/mês', n:'Mesma posição, iluminação e horário. Frente, lado e costas.' },\n    { m:'Performance no treino', f:'Semanal', n:'Anote cargas. Progressão = estímulo anabólico = mais músculo.' },\n    { m:'Qualidade do sono', f:'Diário', n:'Smartwatch ou subjetivo 1–10. Média < 6? Revisar rotina.' },\n    { m:'Dor na fáscia plantar', f:'Diário', n:'Escala 0–10. Se > 5 no treino: reduzir impacto e carga.' },\n  ];\n  const exames = [\n    { prazo:'Próxima consulta', cor:'red', items:['Eletroforese de Hemoglobina — confirmar talassemia minor (microcitose persistente)'] },\n    { prazo:'1–2 semanas', cor:'red', items:['Ortopedista e/ou fisioterapeuta para fasciíte plantar esquerda'] },\n    { prazo:'3 meses', cor:'orange', items:['Vitamina C','Vitamina D 25-OH','Glicose + HbA1c','Perfil lipídico completo'] },\n    { prazo:'6 meses', cor:'yellow', items:['Hemograma','Testosterona total (coleta 7h–10h)','Insulina + HOMA-IR','Vit. C, D, B12','Lipídico completo'] },\n    { prazo:'12 meses', cor:'green', items:['Painel completo — repetir tudo','DEXA (ideal) ou BIA avançada','Revisão com médico assistente'] },\n  ];\n  const marcos = [\n    { m:'Semana 4', v:'Hábito de treino estabelecido. Dormir melhor. Dor na fáscia reduzindo.' },\n    { m:'Semana 8', v:'−4 a −6 kg. A1C descendo. Vit. C normalizada. Energia melhor.' },\n    { m:'Mês 4', v:'−8 a −12 kg. LDL < 110. Fasciíte controlada. Testosterona subindo.' },\n    { m:'Mês 6', v:'−12 a −16 kg. Composição corporal visivelmente diferente.' },\n    { m:'Mês 12', v:'Peso ~72–78 kg. Massa muscular aumentada. Exames metabólicos normalizados.' },\n  ];\n\n  const exColor = (c) => ({red:'red',orange:'orange',yellow:'yellow',green:'green'})[c];\n  const exBg = (c) => ({red:'#fef2f2',orange:'#fff7ed',yellow:'#fefce8',green:'#ecfdf5'})[c];\n  const exBorder = (c) => ({red:'#f87171',orange:'#fb923c',yellow:'#fbbf24',green:'#34d399'})[c];\n\n  return sectionTitle('📅', 'Acompanhamento', 'Métricas, exames e marcos de progresso') +\n    card(`<h3>📏 Métricas para Monitorar<\u002Fh3>\n      ${metricas.map(m => `<div class=\"meal\">\n        <div class=\"meal-hdr\"><span class=\"name\">${h(m.m)}<\u002Fspan>${tag(m.f,'blue')}<\u002Fdiv>\n        <div style=\"font-size:11px;color:#64748b\">${h(m.n)}<\u002Fdiv>\n      <\u002Fdiv>`).join('')}`) +\n    card(`<h3>🧬 Exames de Controle<\u002Fh3>
