 class=\"ct-ex-wrap\" data-pos=\"'+pos+'\"><div class=\"ex\" style=\"padding:12px\">'+head+badges\n      +'<div class=\"stats\" style=\"margin-left:0;margin-top:8px\">'\n        +'<div class=\"stat-mini\"><div class=\"k\">Alvo<\u002Fdiv><div class=\"v\">'+h(e.sr)+'<\u002Fdiv><\u002Fdiv>'\n        +'<div class=\"stat-mini\"><div class=\"k\">Rest<\u002Fdiv><div class=\"v\">'+h(e.rest)+'<\u002Fdiv><\u002Fdiv>'\n        +'<div class=\"stat-mini\" style=\"background:#fff7ed;border-color:#fed7aa\"><div class=\"k\" style=\"color:#c2410c\">RIR alvo<\u002Fdiv><div class=\"v\" style=\"color:#c2410c;font-size:15px\">'+h(e.rir)+'<\u002Fdiv><\u002Fdiv>'\n      +'<\u002Fdiv>'\n      +'<div style=\"display:flex;align-items:center;gap:7px;background:#eff6ff;border:1px solid #dbeafe;border-radius:9px;padding:7px 10px;margin:10px 0\"><span style=\"font-size:13px\">📈<\u002Fspan><span style=\"font-size:11px;color:#1d4ed8;font-weight:600\">'\n        +(top?('Última vez: '+(top.kg?top.kg+' kg':'PC')+' × '+top.reps+' reps · '+ctRelDays(top.dateMs)):'Primeira vez registrando — calibre nesta série')+'<\u002Fspan><\u002Fdiv>'\n      +(prog?('<div style=\"display:flex;align-items:center;gap:7px;background:'+(prog.ok?'#f0fdf4':'#f8fafc')+';border:1px solid '+(prog.ok?'#bbf7d0':'#e2e8f0')+';border-radius:9px;padding:7px 10px;margin:-4px 0 10px\"><span style=\"font-size:13px\">'+(prog.ok?'⬆️':'➡️')+'<\u002Fspan><span style=\"font-size:11px;font-weight:700;color:'+(prog.ok?'#15803d':'#64748b')+'\">'+(prog.ok?('Bateu '+prog.topo+' reps em todas — suba a carga'):('Mantenha '+(prog.kg?prog.kg+' kg':'a carga')+' até fechar '+prog.topo+' reps em todas'))+'<\u002Fspan><\u002Fdiv>'):'')\n      +(lastNote?('<div style=\"display:flex;align-items:flex-start;gap:7px;background:#fffbeb;border:1px solid #fde68a;border-radius:9px;padding:7px 10px;margin:-4px 0 10px\"><span style=\"font-size:13px;line-height:1.3\">✏️<\u002Fspan><span style=\"font-size:11px;color:#92400e;font-weight:600;line-height:1.4\">Anotação da última vez: '+h(lastNote.note)+'<\u002Fspan><\u002Fdiv>'):'')\n      +'<div style=\"display:grid;grid-template-columns:24px 1fr 1fr 46px;gap:7px;font-size:10px;color:#94a3b8;text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px;padding:0 2px\"><span>Sér<\u002Fspan><span>'+(time?'Carga':'Carga (kg)')+'<\u002Fspan><span>Reps<\u002Fspan><span style=\"text-align:center\">Feito<\u002Fspan><\u002Fdiv>'\n      +rows\n      +(e.tech?techBadge(e.tech,phase):'')\n      +'<input type=\"text\" value=\"'+h(l.note)+'\" placeholder=\"✏️ Anotação (ex: fiz na máquina do fundo)\" oninput=\"ctSetNote('+ei+',this.value)\" style=\"width:100%;margin-top:9px;height:40px;border:1.5px solid #f1f5f9;border-radius:10px;padding:0 12px;font-size:12px;color:#475569;background:#fbfcfe\">'\n      +'<\u002Fdiv><\u002Fdiv>';\n  }).join('');\n  const pct=total?Math.round(done/total*100):0;\n  return '<div class=\"sess-hdr\" style=\"display:flex;justify-content:space-between;align-items:center;border-bottom:none;margin-bottom:8px;gap:10px\">'\n      +'<div><div class=\"l\">'+m.em+' '+m.short+'<\u002Fdiv><div class=\"s\">'+sess.day+' · Semana '+live.week+'<\u002Fdiv><\u002Fdiv>'\n      +'<button onclick=\"ctFinish()\" style=\"flex-shrink:0;background:#10b981;color:#fff;border-radius:11px;padding:11px 16px;font-size:13px;font-weight:700\">✓ Finalizar<\u002Fbutton>'\n    +'<\u002Fdiv>'\n    +'<div style=\"display:flex;align-items:center;gap:10px;margin-bottom:14px\"><div style=\"flex:1;height:8px;background:#eef1f5;border-radius:999px;overflow:hidden\"><div style=\"height:100%;background:#0f172a;border-radius:999px;width:'+pct+'%\"><\u002Fdiv><\u002Fdiv><span style=\"font-size:12px;font-weight:700;color:#475569;white-space:nowrap\">'+done+'/'+total+' séries<\u002Fspan><\u002Fdiv>'\n    +'<div style=\"display:flex;align-items:center;gap:8px;margin-bottom:12px;background:#fff;border:1px solid #f1f5f9;border-radius:10px;padding:9px 12px\"><span style=\"font-size:13px;color:#475569;font-weight:600\">📅 Data do treino<\u002Fspan><input type=\"date\" value=\"'+ctSheetDate()+'\" onchange=\"ctSetDate(this.value)\" style=\"margin-left:auto;border:1px solid #e2e8f0;border-radius:8px;padding:7px 9px;font-size:13px;font-weight:600;color:#1e293b\"><\u002Fdiv>'\n    +'<div style=\"display:flex;align-items:center;gap:8px;margin-bottom:10px;padding:0 2px\">'\n      +'<button onclick=\"ctColAll(true)\" style=\"background:#f1f5f9;color:#475569;border-radius:9px;padding:9px 12px;font-size:11px;font-weight:700\">⊟ Recolher todos<\u002Fbutton>'\n      +'<button onclick=\"ctColAll(false)\" style=\"background:#f1f5f9;color:#475569;border-radius:9px;padding:9px 12px;font-size:11px;font-weight:700\">⊞ Expandir<\u002Fbutton>'\n      +(live.order?'<button onclick=\"ctResetOrder()\" style=\"margin-left:auto;background:none;color:#64748b;font-size:11px;font-weight:700;text-decoration:underline\">restaurar ordem<\u002Fbutton>':'')\n      +'<\u002Fdiv>'\n    +exHtml\n    +'<button onclick=\"ctFinish()\" style=\"width:100%;background:#10b981;color:#fff;border-radius:12px;padding:14px;font-size:14px;font-weight:700;margin-top:4px\">✓ Finalizar treino<\u002Fbutton>'\n    +'<button onclick=\"ctDiscard()\" style=\"width:100%;background:none;color:#cbd5e1;font-size:12px;font-weight:600;padding:10px;margin-top:2px\">Descartar este treino<\u002Fbutton>';\n}\n\nfunction ctRenderHome(){\n  const today=ctTodaySession();\n  const cards=CT_ORDER.filter(id=>ctData.live&&ctData.live.sessionId===id).map(id=>{ const s=SESSIONS[id], m=CT_META[id];\n    let last=null; for(let i=ctData.history.length-1;i>=0;i--){ if(ctData.history[i].sessionId===id){ last=ctData.history[i]; break; } }\n    const lastText=last?('Último: '+ctRelDays(last.dateMs)+' · '+last.totalVolume+' kg'):'Ainda não registrado';\n    const resuming=ctData.live&&ctData.live.sessionId===id;\n    return '<div style=\"background:#fff;border-radius:16px;border:1px solid #f1f5f9;box-shadow:0 1px 2px rgba(0,0,0,.04);padding:14px 14px 14px 16px;margin-bottom:10px;display:flex;align-items:center;gap:13px;border-left:5px solid '+m.accent+'\">'\n      +'<span style=\"font-size:22px;width:26px;text-align:center\">'+m.em+'<\u002Fspan>'\n      +'<div style=\"flex:1;min-width:0\"><div style=\"display:flex;align-items:center;gap:7px\"><span style=\"font-size:15px;font-weight:700;color:#1e293b\">'+m.short+'<\u002Fspan>'+(id===today?'<span style=\"font-size:10px;font-weight:700;color:#fff;background:#0f172a;padding:2px 7px;border-radius:999px\">HOJE<\u002Fspan>':'')+'<\u002Fdiv>'\n      +'<div style=\"font-size:11px;color:#64748b;margin-top:2px\">'+s.day+' · '+s.ex.length+' exercícios<\u002Fdiv>'\n      +'<div style=\"font-size:11px;color:#94a3b8;margin-top:3px\">'+(resuming?'▶ treino em andamento':lastText)+'<\u002Fdiv><\u002Fdiv>'\n      +'<button onclick=\"ctStart(\\''+id+'\\')\" style=\"flex-shrink:0;background:'+(resuming?'#10b981':'#0f172a')+';color:#fff;border-radius:11px;padding:11px 15px;font-size:13px;font-weight:700\">'+(resuming?'Continuar':'Iniciar')+'<\u002Fbutton>'\n      +'<\u002Fdiv>';\n  }).join('');\n\n  const exportCard='<div style=\"background:#0f172a;border-radius:16px;padding:16px;margin-bottom:14px;color:#fff\">'\n    +'<div style=\"font-size:14px;font-weight:700\">📤 Exportar para análise<\u002Fdiv>'\n    +'<div style=\"font-size:11px;color:#94a3b8;margin-top:4px;line-height:1.5\">Ao fim das 12 semanas, baixe o arquivo e mande pro Claude analisar a evolução e sugerir o próximo ciclo.<\u002Fdiv>'\n    +'<div style=\"margin-top:12px\"><button onclick=\"ctExportMD()\" style=\"width:100%;background:#fff;color:#0f172a;border-radius:10px;padding:11px;font-size:12px;font-weight:700\">⬇ Baixar resumo .txt<\u002Fbutton><\u002Fdiv>'\n    +'<button onclick=\"ctCopyMD(this)\" style=\"width:100%;margin-top:8px;background:#fbbf24;color:#0f172a;border-radius:10px;padding:11px;font-size:12px;font-weight:700\">📋 Copiar resumo p/ Claude<\u002Fbutton>'\n    +'<\u002Fdiv>';\n\n  const names=ctChartNames(); let chartCard;\n  if(names.length){ const sel=(ctChartEx&&names.indexOf(ctChartEx)>=0)?ctChartEx:names[0];\n    const picker=names.map((nm,i)=>'<button onclick=\"ctSetChart('+i+')\" style=\"flex-shrink:0;font-size:11px;font-weight:600;border:1px solid '+(nm===sel?'#0f172a':'#e2e8f0')+';background:'+(nm===sel?'#0f172a':'#f8fafc')+';color:'+(nm===sel?'#fff':'#475569')+';border-radius:999px;padding:7px 13px;white-space:nowrap\">'+h(nm)+'<\u002Fbutton>').join('');\n    chartCard='<div class=\"card\"><h3>📈 Evolução de carga<\u002Fh3><div style=\"display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:6px\">'+picker+'<\u002Fdiv><div style=\"font-size:13px;font-weight:700;color:#1e293b;margin:2px 2px 4px\">'+h(sel)+'<\u002Fdiv>'+ctChartSVG(sel)+'<div style=\"font-size:10px;color:#94a3b8;text-align:center;margin-top:4px\">carga máxima da série principal · por treino<\u002Fdiv><\u002Fdiv>';\n  } else { chartCard='<div class=\"card\"><h3>📈 Evolução de carga<\u002Fh3><div style=\"text-align:center;padding:20px 10px;color:#94a3b8;font-size:12px;line-height:1.5\">Registre treinos e o gráfico de cada exercício aparece aqui.<\u002Fdiv><\u002Fdiv>'; }\n\n  let histHtml;\n  if(!ctData.history.length){ histHtml='<div style=\"background:#fff;border:1px dashed #cbd5e1;border-radius:16px;padding:28px 20px;text-align:center\"><div style=\"font-size:30px;margin-bottom:8px\">🗓️<\u002Fdiv><div style=\"font-size:13px;color:#64748b\">Seus treinos finalizados aparecem aqui.<\u002Fdiv><\u002Fdiv>'; }\n  else { histHtml=ctData.history.slice().sort((a,b)=>b.dateMs-a.dateMs).map(w=>{ const m=CT_META[w.sessionId]||{em:'💪',short:'Treino',accent:'#0f172a'};\n    return '<button onclick=\"ctOpenDetail('+w.id+')\" style=\"width:100%;text-align:left;background:#fff;border:1px solid #f1f5f9;border-radius:14px;box-shadow:0 1px 2px rgba(0,0,0,.04);padding:13px 14px;margin-bottom:9px;display:flex;align-items:center;gap:12px;border-left:5px solid '+m.accent+'\"><span style=\"font-size:20px\">'+m.em+'<\u002Fspan><div style=\"flex:1;min-width:0\"><div style=\"font-size:14px;font-weight:700;color:#1e293b\">'+m.short+'<\u002Fdiv><div style=\"font-size:11px;color:#64748b;margin-top:2px\">'+ctFmtDate(w.dateMs)+' · '+w.setsDone+' séries · Sem '+w.week+'<\u002Fdiv><\u002Fdiv><div style=\"text-align:right\"><div style=\"font-size:13px;font-weight:800;color:#0f172a\">'+w.totalVolume+' kg<\u002Fdiv><div style=\"font-size:10px;color:#94a3b8\">'+w.durationMin+' min<\u002Fdiv><\u002Fdiv><\u002Fbutton>'; }).join(''); }\n\n  const calib = getPhase(STATE.week).name==='Calibração'\n    ? '<div class=\"box amber\" style=\"margin:0 0 12px\">🎯 <strong>Semanas 1–2: calibração.<\u002Fstrong> Encontre a carga que respeita o RIR alvo, sem buscar recordes.<\u002Fdiv>'\n    : '';\n  return sectionTitle('🏋️','Execução do Treino','Registro de cargas, reps e descanso')\n    +calib\n    +ctRenderWeekStrip()\n    +cards\n    +'<div class=\"grid-3\" style=\"margin:14px 0\"><div class=\"stat\"><div class=\"v\">'+ctMonthCount()+'<\u002Fdiv><div class=\"l\">no mês<\u002Fdiv><\u002Fdiv><div class=\"stat\"><div class=\"v\">'+ctWeekCount()+'<\u002Fdiv><div class=\"l\">esta semana<\u002Fdiv><\u002Fdiv><div class=\"stat\"><div class=\"v\">'+ctData.history.length+'<\u002Fdiv><div class=\"l\">total<\u002Fdiv><\u002Fdiv><\u002Fdiv>'\n    +exportCard+chartCard\n    +'<div class=\"section-title\" style=\"margin:4px 0 10px\"><h2 style=\"font-size:14px\">Treinos registrados<\u002Fh2><\u002Fdiv>'\n    +histHtml;\n}\n\nfunction ctDateStr(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }\nfunction ctMonday(){ const d=new Date(); const off=(d.getDay()+6)%7; return new Date(d.getFullYear(),d.getMonth(),d.getDate()-off); }\nfunction ctActKey(dateStr,act){ return dateStr+'|'+act; }\nfunction ctToggleAct(dateStr,act){ ctData.acts=ctData.acts||{}; const k=ctActKey(dateStr,act); if(ctData.acts[k]) delete ctData.acts[k]; else ctData.acts[k]=1; ctPersist();\n  if(STATE.tab==='protocolos'){ const sc=window.scrollY; document.getElementById('content').innerHTML=renderProtocolos(); window.scrollTo(0,sc); } else { ctRefresh(); } }\nfunction ctActDone(dateStr,act){ return !!(ctData.acts||{})[ctActKey(dateStr,act)]; }\n\nfunction ctRenderWeekStrip(){\n  const mon=ctMonday(), hoje=ctTodayStr();\n  const rows=SEMANA.map(x=>{\n    const dt=new Date(mon.getFullYear(),mon.getMonth(),mon.getDate()+((x.dow+6)%7));\n    const ds=ctDateStr(dt), isHoje=ds===hoje;\n    const gymDone=x.gym && ctData.history.some(w=>w.sessionId===x.gym && ctDateStr(new Date(w.dateMs))===ds);\n    let chips='';\n    if(x.gym){\n      const m=CT_META[x.gym];\n      chips+='<div style=\"display:flex;align-items:center;gap:7px;background:'+(gymDone?'#f0fdf4':'#f8fafc')+';border:1px solid '+(gymDone?'#bbf7d0':'#f1f5f9')+';border-radius:9px;padding:7px 10px\">'\n        +'<span style=\"font-size:14px\">'+(gymDone?'✅':'🏋️')+'<\u002Fspan>'\n        +'<span style=\"flex:1;font-size:12px;font-weight:700;color:'+(gymDone?'#15803d':'#334155')+'\">'+m.short+'<\u002Fspan>'\n        +(gymDone?'':'<button onclick=\"ctStart(\\''+x.gym+'\\')\" style=\"background:#0f172a;color:#fff;border-radius:8px;padding:5px 11px;font-size:11px;font-weight:700\">Iniciar<\u002Fbutton>')\n        +'<\u002Fdiv>';\n    }\n    x.acts.forEach(a=>{\n      const A=ATIVIDADES[a], on=ctActDone(ds,a);\n      chips+='<button onclick=\"ctToggleAct(\\''+ds+'\\',\\''+a+'\\')\" style=\"width:100%;display:flex;align-items:center;gap:7px;background:'+(on?'#f0fdf4':'#f8fafc')+';border:1px solid '+(on?'#bbf7d0':'#f1f5f9')+';border-radius:9px;padding:7px 10px;text-align:left\">'\n        +'<span style=\"font-size:14px\">'+(on?'✅':A.em)+'<\u002Fspan>'\n        +'<span style=\"flex:1;font-size:12px;font-weight:700;color:'+(on?'#15803d':'#334155')+'\">'+A.n+'<\u002Fspan>'\n        +'<span style=\"font-size:10px;color:#94a3b8\">'+(on?'feito':'marcar')+'<\u002Fspan><\u002Fbutton>';\n    });\n    if(!chips) chips='<div style=\"font-size:12px;color:#cbd5e1;padding:7px 10px\">Descanso<\u002Fdiv>';\n    return '<div style=\"display:flex;gap:10px;padding:8px 0;border-top:1px solid #f8fafc\">'\n      +'<div style=\"flex-shrink:0;width:34px;text-align:center;padding-top:6px\"><div style=\"font-size:11px;font-weight:800;color:'+(isHoje?'#0f172a':'#94a3b8')+'\">'+x.d+'<\u002Fdiv>'+(isHoje?'<div style=\"width:5px;height:5px;border-radius:50%;background:#0f172a;margin:3px auto 0\"><\u002Fdiv>':'')+'<\u002Fdiv>'\n      +'<div style=\"flex:1;min-width:0;display:flex;flex-direction:column;gap:5px\">'+chips+'<\u002Fdiv><\u002Fdiv>';\n  }).join('');\n  const total=SEMANA.reduce((a,x)=>a+(x.gym?1:0)+x.acts.length,0);\n  const mondayStr=ctDateStr(mon);\n  let feitos=0;\n  SEMANA.forEach(x=>{ const dt=new Date(mon.getFullYear(),mon.getMonth(),mon.getDate()+((x.dow+6)%7)); const ds=ctDateStr(dt);\n    if(x.gym && ctData.history.some(w=>w.sessionId===x.gym && ctDateStr(new Date(w.dateMs))===ds)) feitos++;\n    x.acts.forEach(a=>{ if(ctActDone(ds,a)) feitos++; }); });\n  return '<div class=\"card\"><h3>📅 Sua semana <span style=\"float:right;font-size:12px;font-weight:800;color:'+(feitos>=total?'#22c55e':'#64748b')+'\">'+feitos+'/'+total+'<\u002Fspan><\u002Fh3>'+rows+'<\u002Fdiv>';\n}\n\nfunction ctOpenDetail(id){ ctDetailId=id; render(); }\nfunction ctCloseDetail(){ ctDetailId=null; render(); }\nfunction ctRenderDetail(){\n  const w=ctData.history.find(x=>x.id===ctDetailId); if(!w) return ctRenderHome();\n  const m=CT_META[w.sessionId]||{em:'💪',short:'Treino'};\n  const exs=w.exercises.filter(e=>e.sets.some(s=>s.done)).map(e=>{\n    const chips=e.sets.filter(s=>s.done).map((s,i)=>'<span style=\"font-size:12px;font-weight:700;background:#f1f5f9;color:#334155;border-radius:8px;padding:5px 9px\">'+(i+1)+': '+(s.kg?s.kg+'kg':'PC')+'×'+(s.reps||'-')+'<\u002Fspan>').join('');\n    return '<div class=\"card\" style=\"padding:13px\"><div style=\"font-size:14px;font-weight:700;color:#1e293b\">'+h(e.name)+'<\u002Fdiv><div style=\"display:flex;flex-wrap:wrap;gap:6px;margin-top:9px\">'+chips+'<\u002Fdiv>'+(e.note?'<div class=\"box amber\" style=\"margin-top:9px\">✏️ '+h(e.note)+'<\u002Fdiv>':'')+'<\u002Fdiv>';\n  }).join('');\n  return '<button onclick=\"ctCloseDetail()\" style=\"background:none;color:#64748b;font-size:13px;font-weight:600;padding:4px 0;margin-bottom:10px\">← Voltar<\u002Fbutton>'\n    +'<div style=\"background:#0f172a;border-radius:16px;padding:16px;color:#fff;margin-bottom:14px\"><div style=\"font-size:17px;font-weight:800\">'+m.em+' '+m.short+'<\u002Fdiv><div style=\"font-size:12px;color:#94a3b8;margin-top:3px\">'+ctFmtDate(w.dateMs)+' · Semana '+w.week+'<\u002Fdiv><div style=\"display:flex;gap:18px;margin-top:12px\"><div><div style=\"font-size:18px;font-weight:800\">'+w.totalVolume+' kg<\u002Fdiv><div style=\"font-size:10px;color:#94a3b8\">volume<\u002Fdiv><\u002Fdiv><div><div style=\"font-size:18px;font-weight:800\">'+w.setsDone+'<\u002Fdiv><div style=\"font-size:10px;color:#94a3b8\">séries<\u002Fdiv><\u002Fdiv><div><div style=\"font-size:18px;font-weight:800\">'+w.durationMin+' min<\u002Fdiv><div style=\"font-size:10px;color:#94a3b8\">duração<\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv>'\n    +exs\n    +'<button onclick=\"ctDeleteWorkout('+w.id+')\" style=\"width:100%;background:#fff;border:1px solid #fecaca;color:#dc2626;border-radius:12px;padding:13px;font-size:13px;font-weight:700;margin-top:4px\">🗑 Excluir este treino<\u002Fbutton>';\n}\n\nfunction ctDeleteWorkout(id){ if(!confirm('Excluir este treino do histórico? Não dá pra desfazer.')) return; ctData.history=ctData.history.filter(w=>w.id!==id); ctDetailId=null; ctPersist(); render(); }\nfunction ctSheetDate(){ const l=ctData.live; return (l&&l.dateOverride)?l.dateOverride:ctTodayStr(); }\nfunction ctSetDate(v){ if(!ctData.live||!v) return; ctData.live.dateOverride=v; ctPersist(); }\n\n// ─── Render orchestration ───────────────────────────────────────────\nfunction render() {\n  if (!TABS.some(t => t.id === STATE.tab)) { STATE.tab = 'diet'; save('tab', 'diet'); }\n  document.getElementById('tabs').innerHTML = TABS.map(t =>\n    `<button class=\"tab ${STATE.tab===t.id?'active':''}\" data-act=\"setTab\" data-val=\"${t.id}\">\n      <span class=\"em\">${t.em}<\u002Fspan><span>${t.label}<\u002Fspan><\u002Fbutton>`).join('');\n  const fns = { diet: renderDiet, training: renderTraining, exec: renderExec, supps: renderSupps, protocolos: renderProtocolos, history: renderHistory };\n  const fn = fns[STATE.tab] || renderDiet;\n  document.getElementById('content').innerHTML = fn();\n  window.scrollTo({ top: 0, behavior: 'instant' });\n}\n\n// ─── Event delegation ───────────────────────────────────────────────\ndocument.body.addEventListener('click', (e) => {\n  const btn = e.target.closest('[data-act]');\n  if (!btn) return;\n  const act = btn.dataset.act;\n  const val = btn.dataset.val;\n  if (act === 'setTab') { ctDetailId = null; set('tab', val); }\n  else if (act === 'setDayType') set('dayType', val);\n  else if (act === 'setWeek') set('week', parseInt(val, 10));\n  else if (act === 'setSession') set('session', val);\n});\n\n// ─── Install hint removed (não aplicável dentro do Claude) ───────────\n\n// ─── Init ───────────────────────────────────────────────────────────\nrender();\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
