ype=\"number\" step=\"0.5\" placeholder=\"88\" style=\"width:100%;padding:7px 10px;border:1px solid #e2e8f0;border-radius:8px;font-size:13px;color:#1e293b\"><\u002Fdiv>\n        <div><label style=\"font-size:11px;color:#64748b;display:block;margin-bottom:3px\">Abdome (cm)<\u002Flabel>\n          <input id=\"h_abdome\" type=\"number\" step=\"0.5\" placeholder=\"90\" style=\"width:100%;padding:7px 10px;border:1px solid #e2e8f0;border-radius:8px;font-size:13px;color:#1e293b\"><\u002Fdiv>\n        <div><label style=\"font-size:11px;color:#64748b;display:block;margin-bottom:3px\">Quadril (cm)<\u002Flabel>\n          <input id=\"h_quadril\" type=\"number\" step=\"0.5\" placeholder=\"105\" style=\"width:100%;padding:7px 10px;border:1px solid #e2e8f0;border-radius:8px;font-size:13px;color:#1e293b\"><\u002Fdiv>\n        <div><label style=\"font-size:11px;color:#64748b;display:block;margin-bottom:3px\">Braço relax. (cm)<\u002Flabel>\n          <input id=\"h_braco\" type=\"number\" step=\"0.5\" placeholder=\"34\" style=\"width:100%;padding:7px 10px;border:1px solid #e2e8f0;border-radius:8px;font-size:13px;color:#1e293b\"><\u002Fdiv>\n        <div><label style=\"font-size:11px;color:#64748b;display:block;margin-bottom:3px\">Peitoral (cm)<\u002Flabel>\n          <input id=\"h_peito\" type=\"number\" step=\"0.5\" placeholder=\"98\" style=\"width:100%;padding:7px 10px;border:1px solid #e2e8f0;border-radius:8px;font-size:13px;color:#1e293b\"><\u002Fdiv>\n        <div><label style=\"font-size:11px;color:#64748b;display:block;margin-bottom:3px\">% Gordura<\u002Flabel>\n          <input id=\"h_pct\" type=\"number\" step=\"0.1\" placeholder=\"31.0\" style=\"width:100%;padding:7px 10px;border:1px solid #e2e8f0;border-radius:8px;font-size:13px;color:#1e293b\"><\u002Fdiv>\n      <\u002Fdiv>\n      <button onclick=\"addHistMed()\" style=\"width:100%;background:#0f172a;color:#fff;border-radius:10px;padding:10px;font-size:13px;font-weight:700\">Salvar medição<\u002Fbutton>\n      ${userMeds.length ? `<button onclick=\"clearHistMed()\" style=\"width:100%;margin-top:6px;color:#ef4444;font-size:11px;padding:4px\">Limpar medições adicionadas<\u002Fbutton>` : ''}\n    <\u002Fdiv>`;\n\n  return `\n    <div class=\"section-title\"><div class=\"ico\">📈<\u002Fdiv>\n      <h2>Histórico de Evolução<\u002Fh2>\n      <div class=\"sub\">30 medições · Mar/2022 → hoje · Altura: 166 cm<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"card\" style=\"padding:10px 12px;margin-bottom:12px;background:linear-gradient(135deg,#0f172a,#1e3a5f)\">\n      <div style=\"font-size:11px;color:#94a3b8;font-weight:600;letter-spacing:1px;text-transform:uppercase;margin-bottom:8px\">Resumo desde o início<\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;text-align:center\">\n        <div><div style=\"font-size:20px;font-weight:800;color:#fb923c\">−1,0<\u002Fdiv><div style=\"font-size:10px;color:#94a3b8\">kg peso total<\u002Fdiv><\u002Fdiv>\n        <div><div style=\"font-size:20px;font-weight:800;color:#22c55e\">−7<\u002Fdiv><div style=\"font-size:10px;color:#94a3b8\">cm cintura<\u002Fdiv><\u002Fdiv>\n        <div><div style=\"font-size:20px;font-weight:800;color:#60a5fa\">+2<\u002Fdiv><div style=\"font-size:10px;color:#94a3b8\">cm peitoral 🏆<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"margin-top:8px;padding-top:8px;border-top:1px solid rgba(255,255,255,.1);display:flex;justify-content:space-around;text-align:center\">\n        <div><div style=\"font-size:14px;font-weight:700;color:#a78bfa\">+2cm<\u002Fdiv><div style=\"font-size:10px;color:#94a3b8\">braço<\u002Fdiv><\u002Fdiv>\n        <div><div style=\"font-size:14px;font-weight:700;color:#f472b6\">−7cm<\u002Fdiv><div style=\"font-size:10px;color:#94a3b8\">quadril<\u002Fdiv><\u002Fdiv>\n        <div><div style=\"font-size:14px;font-weight:700;color:#fb923c\">0cm<\u002Fdiv><div style=\"font-size:10px;color:#94a3b8\">abdome (zerou)<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    ${miniChart(allData, 'peso', '#3b82f6', 77, ' kg', '⚖️ Peso corporal')}\n    ${miniChart(allData, 'cintura', '#f97316', 77, ' cm', '📏 Cintura')}\n    ${miniChart(allData, 'abdome', '#ef4444', 80, ' cm', '📏 Abdome')}\n    ${miniChart(allData, 'pct', '#8b5cf6', 15, '%', '🧪 % Gordura')}\n    ${miniChart(allData, 'gorda', '#fb923c', 11.55, ' kg', '🔥 Massa Gorda (kg)')}\n    ${miniChart(allData, 'peito', '#0ea5e9', 105, ' cm', '💪 Peitoral')}\n    ${miniChart(allData, 'braco', '#10b981', 40, ' cm', '💪 Braço relaxado')}\n\n    <div class=\"card\" style=\"margin-bottom:12px;background:#fefce8;border-color:#fde047\">\n      <div style=\"font-size:12px;color:#854d0e;font-weight:600;margin-bottom:4px\">⚠️ Ponto de atenção: estagnação 2024<\u002Fdiv>\n      <div style=\"font-size:12px;color:#713f12;line-height:1.5\">Mínimo histórico atingido em Jan/24 (83,5 kg) — depois estagnação e recuperação de ~9 kg até mai/26. A taxa comprovada de perda quando funcionou foi <b>~0,9 kg/mês<\u002Fb>. Com o treino atual + dieta ajustada, meta realista: <b>0,8–1,2 kg/mês<\u002Fb>.<\u002Fdiv>\n    <\u002Fdiv>\n\n    ${formHtml}\n  `;\n}\n\nfunction addHistMed() {\n  const get = id => { const el = document.getElementById(id); return el ? el.value.trim() : ''; };\n  const d = get('h_data'); if (!d) { alert('Informe a data'); return; }\n  const med = {\n    d, \n    peso: parseFloat(get('h_peso'))||null,\n    cintura: parseFloat(get('h_cintura'))||null,\n    abdome: parseFloat(get('h_abdome'))||null,\n    quadril: parseFloat(get('h_quadril'))||null,\n    braco: parseFloat(get('h_braco'))||null,\n    peito: parseFloat(get('h_peito'))||null,\n    pct: parseFloat(get('h_pct'))||null,\n    gorda: null,\n  };\n  try {\n    const existing = JSON.parse(MEM['history_measurements'] || '[]');\n    existing.push(med);\n    save('history_measurements', JSON.stringify(existing));\n  } catch(e) { save('history_measurements', JSON.stringify([med])); }\n  render();\n}\n\nfunction clearHistMed() {\n  if (confirm('Apagar todas as medições adicionadas?')) { delete MEM['history_measurements']; persistStore(); render(); }\n}\n\n// ─── TAB · EXECUÇÃO (registro de treino) ────────────────────────────\nconst CT_KEY = 'ct_workout_v1';\nlet ctData = { history: [], live: null };\n(function(){ try { const r = localStorage.getItem(CT_KEY); if (r) { const d = JSON.parse(r); ctData.history = d.history || []; ctData.live = d.live || null; } } catch(e) {} })();\nfunction ctPersist(){ try { localStorage.setItem(CT_KEY, JSON.stringify({ history: ctData.history, live: ctData.live })); } catch(e) {} }\n\nlet ctChartEx = null, ctDetailId = null;\nlet ctRest = { running:false, endAt:0, total:0, remaining:0 };\nlet ctTicker = null;\n\nconst CT_ORDER = ['upperA','lowerA','upperB','lowerB'];\nconst CT_META = {\n  upperA: { em:'🔵', short:'Upper A', accent:'#3b82f6' },\n  lowerA: { em:'🔴', short:'Lower A', accent:'#ef4444' },\n  upperB: { em:'🔵', short:'Upper B', accent:'#3b82f6' },\n  lowerB: { em:'🟢', short:'Lower B', accent:'#10b981' },\n};\n\nfunction ctNum(v){ const n = parseFloat(String(v==null?'':v).replace(',','.')); return isFinite(n)?n:0; }\nfunction ctSetCount(sr){ const m = String(sr).match(/^(\\d+)/); return m?parseInt(m[1],10):3; }\nfunction ctIsTime(sr){ return /s\\b|seg/i.test(String(sr).split('×')[1]||''); }\nfunction ctRestSec(r){ return parseInt(String(r),10)||90; }\nfunction ctRelDays(ms){ const d = Math.floor((Date.now()-ms)/86400000); if(d<=0)return 'hoje'; if(d===1)return 'ontem'; return 'há '+d+' dias'; }\nfunction ctFmtDate(ms){ return new Date(ms).toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit',month:'short'}); }\nfunction ctTodayStr(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }\nfunction ctMMSS(s){ const m=Math.floor(s/60), x=s%60; return m+':'+String(x).padStart(2,'0'); }\nfunction ctTodaySession(){ return ({1:'upperA',2:'lowerA',4:'upperB',5:'lowerB'})[new Date().getDay()] || null; }\nfunction ctExName(i){ return SESSIONS[ctData.live.sessionId].ex[i].n; }\n\nfunction ctLastFor(name){ for(let i=ctData.history.length-1;i>=0;i--){ const w=ctData.history[i]; const e=(w.exercises||[]).find(x=>x.name===name); if(e) return {dateMs:w.dateMs, sets:e.sets}; } return null; }\nfunction ctLastTop(name){ const l=ctLastFor(name); if(!l) return null; const done=l.sets.filter(s=>s.done&&(s.kg>0||s.reps>0)); if(!done.length) return null; let b=done[0]; done.forEach(s=>{ if((s.kg||0)>(b.kg||0)) b=s; }); return {kg:b.kg,reps:b.reps,dateMs:l.dateMs}; }\nfunction ctMonthCount(){ const n=new Date(); return ctData.history.filter(w=>{ const d=new Date(w.dateMs); return d.getMonth()===n.getMonth()&&d.getFullYear()===n.getFullYear(); }).length; }\nfunction ctWeekCount(){ const d=new Date(); const day=(d.getDay()+6)%7; const monday=new Date(d.getFullYear(),d.getMonth(),d.getDate()-day).getTime(); return ctData.history.filter(w=>w.dateMs>=monday).length; }\n\n// re-render só o conteúdo, preservando o scroll (sem pular pro topo)\nfunction ctRefresh(){ const sc=window.scrollY; const el=document.getElementById('content'); if(el){ el.innerHTML=renderExec(); window.scrollTo(0,sc); } }\n\nfunction ctStart(id){\n  if(!(ctData.live && ctData.live.sessionId===id)){\n    const sess=SESSIONS[id]; const ex={};\n    sess.ex.forEach(e=>{ const n=ctSetCount(e.sr); const last=ctLastFor(e.n);\n      ex[e.n]={ note:'', sets:Array.from({length:n},(_,i)=>({\n        kg: last&&last.sets[i]&&last.sets[i].kg ? String(last.sets[i].kg) : '',\n        reps: last&&last.sets[i]&&last.sets[i].reps ? String(last.sets[i].reps) : '',\n        done:false })) }; });\n    ctData.live={ sessionId:id, week:STATE.week, startedAt:Date.now(), ex };\n  }\n  ctDetailId=null; ctPersist(); render();\n}\nfunction ctToggle(ei,si){\n  const live=ctData.live; if(!live) return; const name=ctExName(ei);\n  const s=live.ex[name].sets[si]; const was=s.done; s.done=!was; ctPersist(); ctRefresh();\n  if(!was){ const def=SESSIONS[live.sessionId].ex.find(e=>e.n===name); ctStartRest(ctRestSec(def.rest)); }\n}\nfunction ctSetField(ei,si,field,val){ const live=ctData.live; if(!live) return; live.ex[ctExName(ei)].sets[si][field]=val; ctPersist(); }\nfunction ctSetNote(ei,val){ const live=ctData.live; if(!live) return; live.ex[ctExName(ei)].note=val; ctPersist(); }\nfunction ctDiscard(){ if(!confirm('Descartar este treino? Os dados não serão salvos.')) return; ctData.live=null; ctSkipRest(); ctPersist(); render(); }\nfunction ctFinish(){\n  const live=ctData.live; if(!live) return; const sess=SESSIONS[live.sessionId];\n  const exercises=sess.ex.map(e=>{ const l=live.ex[e.n]||{sets:[],note:''}; return {\n    name:e.n, target:e.sr, rest:e.rest, rir:e.rir, note:l.note||'',\n    sets:(l.sets||[]).map(s=>({ kg:ctNum(s.kg), reps:ctNum(s.reps), done:!!s.done })) }; });\n  const setsDone=exercises.reduce((a,e)=>a+e.sets.filter(s=>s.done).length,0);\n  if(setsDone===0){ if(!confirm('Nenhuma série marcada como feita. Descartar este treino?')) return; ctData.live=null; ctSkipRest(); ctPersist(); render(); return; }\n  const totalVolume=Math.round(exercises.reduce((a,e)=>a+e.sets.filter(s=>s.done).reduce((b,s)=>b+(s.kg*s.reps||0),0),0));\n  const durationMin=Math.max(1,Math.round((Date.now()-live.startedAt)/60000));\n  ctData.history.push({ id:Date.now(), dateMs:Date.now(), date:new Date().toISOString(), week:live.week, sessionId:live.sessionId, setsDone, totalVolume, durationMin, exercises });\n  ctData.live=null; ctSkipRest(); ctPersist(); render();\n}\n\n// Cronômetro de descanso\nfunction ctStartRest(sec){ ctRest={ running:true, endAt:Date.now()+sec*1000, total:sec, remaining:sec }; ctShowRestBar(); if(!ctTicker) ctTicker=setInterval(ctTick,250); }\nfunction ctTick(){ if(!ctRest.running) return; const rem=Math.max(0,Math.round((ctRest.endAt-Date.now())/1000)); if(rem<=0){ ctRest.running=false; ctUpdateRestBar(0); ctBeep(); try{ navigator.vibrate && navigator.vibrate([300,120,300]); }catch(e){} ctHideRestBar(); } else if(rem!==ctRest.remaining){ ctRest.remaining=rem; ctUpdateRestBar(rem); } }\nfunction ctAddRest(){ if(!ctRest.running) return; ctRest.endAt+=15000; ctRest.total+=15; ctRest.remaining=Math.max(0,Math.round((ctRest.endAt-Date.now())/1000)); ctUpdateRestBar(ctRest.remaining); }\nfunction ctSkipRest(){ ctRest.running=false; ctHideRestBar(); }\nfunction ctShowRestBar(){ const b=document.getElementById('ctRestBar'); if(b){ b.classList.add('show'); ctUpdateRestBar(ctRest.remaining); } }\nfunction ctHideRestBar(){ const b=document.getElementById('ctRestBar'); if(b) b.classList.remove('show'); }\nfunction ctUpdateRestBar(rem){ const t=document.getElementById('ctRestTime'); if(t) t.textContent=ctMMSS(rem); const ring=document.getElementById('ctRestRing'); if(ring&&ctRest.total){ const elapsed=Math.max(0,Math.min(100,(1-rem/ctRest.total)*100)); ring.style.background='conic-gradient(#34d399 '+elapsed.toFixed(0)+'%, #334155 0)'; } }\nfunction ctBeep(){ try{ const AC=window.AudioContext||window.webkitAudioContext; const ac=new AC(); [0,0.18,0.36].forEach((t,i)=>{ const o=ac.createOscillator(),g=ac.createGain(); o.connect(g); g.connect(ac.destination); o.type='sine'; o.frequency.value=i===2?1100:880; g.gain.setValueAtTime(0.0001,ac.currentTime+t); g.gain.exponentialRampToValueAtTime(0.35,ac.currentTime+t+0.02); g.gain.exponentialRampToValueAtTime(0.0001,ac.currentTime+t+0.14); o.start(ac.currentTime+t); o.stop(ac.currentTime+t+0.16); }); }catch(e){} }\n\n// Gráfico de evolução de carga\nfunction ctChartNames(){ const set=new Set(); ctData.history.forEach(w=>(w.exercises||[]).forEach(e=>{ if(e.sets.some(s=>s.done&&s.kg>0)) set.add(e.name); })); return Array.from(set); }\nfunction ctChartPts(name){ const pts=[]; ctData.history.forEach(w=>{ const e=(w.exercises||[]).find(x=>x.name===name); if(e){ const tops=e.sets.filter(s=>s.done&&s.kg>0).map(s=>s.kg); if(tops.length) pts.push({x:w.dateMs,y:Math.max.apply(null,tops)}); } }); return pts; }\nfunction ctSetChart(i){ ctChartEx=ctChartNames()[i]; ctRefresh(); }\nfunction ctChartSVG(name){\n  const pts=ctChartPts(name); if(!pts.length) return '<div style=\"text-align:center;padding:20px;color:#94a3b8;font-size:12px\">Sem dados ainda.<\u002Fdiv>';\n  const W=320,H=140,pl=34,pr=16,pt=18,pb=24; const ys=pts.map(p=>p.y); let mn=Math.min.apply(null,ys),mx=Math.max.apply(null,ys); if(mn===mx){ mn=Math.max(0,mn-5); mx=mx+5; } const n=pts.length;\n  const X=i=> n===1?(pl+(W-pl-pr)/2):pl+(i/(n-1))*(W-pl-pr); const Y=v=>(H-pb)-((v-mn)/(mx-mn))*(H-pt-pb);\n  let g=''; [0,0.5,1].forEach(f=>{ const yy=(pt+f*(H-pt-pb)).toFixed(1); g+='<line x1=\"'+pl+'\" y1=\"'+yy+'\" x2=\"'+(W-pr)+'\" y2=\"'+yy+'\" stroke=\"#f1f5f9\"/>'; });\n  const line=pts.map((p,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(p.y).toFixed(1)).join(' ');\n  const area=line+' L '+X(n-1).toFixed(1)+' '+(H-pb)+' L '+X(0).toFixed(1)+' '+(H-pb)+' Z';\n  let dots=''; pts.forEach((p,i)=>{ dots+='<circle cx=\"'+X(i).toFixed(1)+'\" cy=\"'+Y(p.y).toFixed(1)+'\" r=\"'+(i===n-1?5:3.5)+'\" fill=\"'+(i===n-1?'#10b981':'#0f172a')+'\" stroke=\"#fff\" stroke-width=\"2\"/>'; });\n  const last=pts[n-1];\n  return '<svg width=\"100%\" viewBox=\"0 0 '+W+' '+H+'\">'+g+'<path d=\"'+area+'\" fill=\"#0f172a\" opacity=\"0.06\"/>'+(n>1?'<path d=\"'+line+'\" fill=\"none\" stroke=\"#0f172a\" stroke-width=\"2.5\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>':'')+dots+'<text x=\"'+(pl-6)+'\" y=\"'+(Y(mx)+4).toFixed(1)+'\" font-size=\"10\" fill=\"#94a3b8\" text-anchor=\"end\">'+mx+'<\u002Ftext><text x=\"'+(pl-6)+'\" y=\"'+(Y(mn)+4).toFixed(1)+'\" font-size=\"10\" fill=\"#94a3b8\" text-anchor=\"end\">'+mn+'<\u002Ftext><text x=\"'+X(n-1).toFixed(1)+'\" y=\"'+(Y(last.y)-10).toFixed(1)+'\" font-size=\"12\" font-weight=\"800\" fill=\"#10b981\" text-anchor=\"middle\">'+last.y+'kg<\u002Ftext><\u002Fsvg>';\n}\n\n// Exportação\nfunction ctDownload(text,name,type){ try{ const blob=new Blob([text],{type:type}); const a=document.createElement('a'); const url=URL.createObjectURL(blob); a.href=url; a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(url); a.remove(); },120); }catch(e){ alert('Não foi possível baixar neste leitor. Tente abrir no Safari/Chrome.'); } }\nfunction ctExportJSON(){ const data={ atleta:'Wesley Lima da Silva', plano:'Upper/Lower 4×/semana · 12 semanas progressivas', exportadoEm:new Date().toISOString(), totalTreinos:ctData.history.length, treinos:ctData.history }; ctDownload(JSON.stringify(data,null,2),'treinos-wesley-'+ctTodayStr()+'.json','application/json'); }\nfunction ctBuildMD(){\n  const H=ctData.history; let md='# Histórico de treinos — Wesley Lima da Silva\\n';\n  md+='Plano: Upper/Lower 4×/semana · 12 semanas progressivas.\\n';\n  md+='Exportado em '+new Date().toLocaleString('pt-BR')+' · '+H.length+' treinos registrados.\\n\\n';\n  md+='> Para o Claude: abaixo está o registro de cada treino com cargas e reps por série. Analise a progressão de carga por exercício ao longo das semanas, identifique platôs e sugira ajustes para o próximo ciclo.\\n\\n';\n  H.forEach(w=>{ md+='## '+ctFmtDate(w.dateMs)+' — '+(CT_META[w.sessionId]?CT_META[w.sessionId].short:w.sessionId)+' (Semana '+w.week+')\\n';\n    md+='Volume: '+w.totalVolume+' kg · Séries feitas: '+w.setsDone+' · Duração: '+w.durationMin+' min\\n\\n';\n    w.exercises.forEach(e=>{ const done=e.sets.filter(s=>s.done); if(!done.length) return;\n      md+='- **'+e.name+'** (alvo '+e.target+'): '+done.map(s=>(s.kg?s.kg+'kg':'PC')+'×'+(s.reps||'-')).join(', ');\n      if(e.note) md+=' — _'+e.note+'_'; md+='\\n'; });\n    md+='\\n'; });\n  return md;\n}\nfunction ctExportMD(){ ctDownload(ctBuildMD(),'treinos-wesley-'+ctTodayStr()+'.txt','text/plain'); }\nfunction ctFallbackCopy(t,ok){ try{ const ta=document.createElement('textarea'); ta.value=t; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); ok(); }catch(e){} }\nfunction ctCopyMD(btn){ const md=ctBuildMD(); const ok=()=>{ if(btn){ const o=btn.textContent; btn.textContent='✓ Copiado!'; setTimeout(()=>{ btn.textContent=o; },1800); } }; try{ navigator.clipboard.writeText(md).then(ok,()=>ctFallbackCopy(md,ok)); }catch(e){ ctFallbackCopy(md,ok); } }\n\n// Render\nfunction renderExec(){ if(ctDetailId) return ctRenderDetail(); if(ctData.live) return ctRenderSheet(); return ctRenderHome(); }\n\nfunction ctRenderSheet(){\n  const live=ctData.live, sess=SESSIONS[live.sessionId], m=CT_META[live.sessionId], phase=getPhase(live.week);\n  let total=0, done=0;\n  const exHtml=sess.ex.map((e,ei)=>{\n    const l=live.ex[e.n]||{sets:[],note:''}; const time=ctIsTime(e.sr); const top=ctLastTop(e.n);\n    const rows=(l.sets||[]).map((st,si)=>{ total++; if(st.done) done++;\n      return '<div class=\"ct-set-row\" style=\"'+(st.done?'background:#f0fdf4;border-radius:9px;':'')+'\">'\n        +'<span style=\"font-size:13px;font-weight:700;color:#94a3b8;text-align:center\">'+(si+1)+'<\u002Fspan>'\n        +'<input class=\"ct-inp\" type=\"text\" inputmode=\"decimal\" value=\"'+h(st.kg)+'\" placeholder=\"'+(time?'—':'kg')+'\" oninput=\"ctSetField('+ei+','+si+',\\'kg\\',this.value)\">'\n        +'<input class=\"ct-inp\" type=\"text\" inputmode=\"numeric\" value=\"'+h(st.reps)+'\" placeholder=\"'+(time?'seg':'reps')+'\" oninput=\"ctSetField('+ei+','+si+',\\'reps\\',this.value)\">'\n        +'<button class=\"ct-check '+(st.done?'done':'')+'\" onclick=\"ctToggle('+ei+','+si+')\">'+(st.done?'✓':'')+'<\u002Fbutton>'\n        +'<\u002Fdiv>'; }).join('');\n    return '<div class=\"ex '+(e.priority?'priority':'')+'\" style=\"padding:12px\">'\n      +(e.priority?'<div class=\"prio-tag\">🔴 Bíceps prioritário<\u002Fdiv>':'')\n      +'<div class=\"head\"><span class=\"num\">'+(ei+1)+'.<\u002Fspan><span class=\"name\">'+h(e.n)+'<\u002Fspan><\u002Fdiv>'\n      +'<div class=\"note\">'+h(e.note)+'<\u002Fdiv>'\n      +'<div class=\"stats\" style=\"margin-left:0;margin-top:8px\">'\n        +'<div class=\"stat-mini\"><div class=\"k\">Alvo<\u002Fdiv><div class=\"v\">'+h(e.sr)+'<\u002Fdiv><\u002Fdiv>'\n        +'<div class=\"stat-mini\"><div class=\"k\">Rest<\u002Fdiv><div class=\"v\">'+h(e.rest)+'<\u002Fdiv><\u002Fdiv>'\n        +'<div class=\"stat-mini\"><div class=\"k\">RIR<\u002Fdiv><div class=\"v\">'+h(e.rir)+'<\u002Fdiv><\u002Fdiv>'\n      +'<\u002Fdiv>'\n      +'<div style=\"display:flex;align-items:center;gap:7px;background:#eff6ff;border:1px solid #dbeafe;border-radius:9px;padding:7px 10px;margin:10px 0\"><span style=\"font-size:13px\">📈<\u002Fspan><span style=\"font-size:11px;color:#1d4ed8;font-weight:600\">'\n        +(top?('Última vez: '+(top.kg?top.kg+' kg':'PC')+' × '+top.reps+' reps · '+ctRelDays(top.dateMs)):'Primeira vez — defina sua base')+'<\u002Fspan><\u002Fdiv>'\n      +'<div style=\"display:grid;grid-template-columns:24px 1fr 1fr 46px;gap:7px;font-size:10px;color:#94a3b8;text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px;padding:0 2px\"><span>Sér<\u002Fspan><span>'+(time?'Carga':'Carga (kg)')+'<\u002Fspan><span>Reps<\u002Fspan><span style=\"text-align:center\">Feito<\u002Fspan><\u002Fdiv>'\n      +rows\n      +(e.tech?techBadge(e.tech,phase):'')\n      +'<input type=\"text\" value=\"'+h(l.note)+'\" placeholder=\"✏️ Anotação (ex: ombro incomodou)\" oninput=\"ctSetNote('+ei+',this.value)\" style=\"width:100%;margin-top:9px;height:40px;border:1.5px solid #f1f5f9;border-radius:10px;padding:0 12px;font-size:12px;color:#475569;background:#fbfcfe\">'\n      +'<\u002Fdiv>';\n  }).join('');\n  const pct=total?Math.round(done/total*100):0;\n  return '<div class=\"sess-hdr\" style=\"display:flex;justify-content:space-between;align-items:center;border-bottom:none;margin-bottom:8px;gap:10px\">'\n      +'<div><div class=\"l\">'+m.em+' '+m.short+'<\u002Fdiv><div class=\"s\">'+sess.day+' · Semana '+live.week+' · '+h(sess.sub||'')+'<\u002Fdiv><\u002Fdiv>'\n      +'<button onclick=\"ctFinish()\" style=\"flex-shrink:0;background:#10b981;color:#fff;border-radius:11px;padding:11px 16px;font-size:13px;font-weight:700\">✓ Finalizar<\u002Fbutton>'\n    +'<\u002Fdiv>'\n    +'<div style=\"display:flex;align-items:center;gap:10px;margin-bottom:14px\"><div style=\"flex:1;height:8px;background:#eef1f5;border-radius:999px;overflow:hidden\"><div style=\"height:100%;background:#0f172a;border-radius:999px;width:'+pct+'%\"><\u002Fdiv><\u002Fdiv><span style=\"font-size:12px;font-weight:700;color:#475569;white-space:nowrap\">'+done+'/'+total+' séries<\u002Fspan><\u002Fdiv>'\n    +exHtml\n    +'<button onclick=\"ctFinish()\" style=\"width:100%;background:#10b981;color:#fff;border-radius:12px;padding:14px;font-size:14px;font-weight:700;margin-top:4px\">✓ Finalizar treino<\u002Fbutton>'\n    +'<button onclick=\"ctDiscard()\" style=\"width:100%;background:none;color:#cbd5e1;font-size:12px;font-weight:600;padding:10px;margin-top:2px\">Descartar este treino<\u002Fbutton>';\n}\n\nfunction ctRenderHome(){\n  const today=ctTodaySession();\n  const cards=CT_ORDER.map(id=>{ const s=SESSIONS[id], m=CT_META[id];\n    let last=null; for(let i=ctData.history.length-1;i>=0;i--){ if(ctData.history[i].sessionId===id){ last=ctData.history[i]; break; } }\n    const lastText=last?('Último: '+ctRelDays(last.dateMs)+' · '+last.totalVolume+' kg'):'Ainda não registrado';\n    const resuming=ctData.live&&ctData.live.sessionId===id;\n    return '<div style=\"background:#fff;border-radius:16px;border:1px solid #f1f5f9;box-shadow:0 1px 2px rgba(0,0,0,.04);padding:14px 14px 14px 16px;margin-bottom:10px;display:flex;align-items:center;gap:13px;border-left:5px solid '+m.accent+'\">'\n      +'<span style=\"font-size:22px;width:26px;text-align:center\">'+m.em+'<\u002Fspan>'\n      +'<div style=\"flex:1;min-width:0\"><div style=\"display:flex;align-items:center;gap:7px\"><span style=\"font-size:15px;font-weight:700;color:#1e293b\">'+m.short+'<\u002Fspan>'+(id===today?'<span style=\"font-size:10px;font-weight:700;color:#fff;background:#0f172a;padding:2px 7px;border-radius:999px\">HOJE<\u002Fspan>':'')+'<\u002Fdiv>'\n      +'<div style=\"font-size:11px;color:#64748b;margin-top:2px\">'+s.day+' · '+s.ex.length+' exercícios<\u002Fdiv>'\n      +'<div style=\"font-size:11px;color:#94a3b8;margin-top:3px\">'+(resuming?'▶ treino em andamento':lastText)+'<\u002Fdiv><\u002Fdiv>'\n      +'<button onclick=\"ctStart(\\''+id+'\\')\" style=\"flex-shrink:0;background:'+(resuming?'#10b981':'#0f172a')+';color:#fff;border-radius:11px;padding:11px 15px;font-size:13px;font-weight:700\">'+(resuming?'Continuar':'Iniciar')+'<\u002Fbutton>'\n      +'<\u002Fdiv>';\n  }).join('');\n\n  const exportCard='<div style=\"background:#0f172a;border-radius:16px;padding:16px;margin-bottom:14px;color:#fff\">'\n    +'<div style=\"font-size:14px;font-weight:700\">📤 Exportar para análise<\u002Fdiv>'\n    +'<div style=\"font-size:11px;color:#94a3b8;margin-top:4px;line-height:1.5\">Ao fim das 12 semanas, baixe o arquivo e mande pro Claude analisar a evolução e sugerir o próximo ciclo.<\u002Fdiv>'\n    +'<div style=\"display:flex;gap:8px;margin-top:12px\"><button onclick=\"ctExportJSON()\" style=\"flex:1;background:#fff;color:#0f172a;border-radius:10px;padding:11px;font-size:12px;font-weight:700\">⬇ Baixar JSON<\u002Fbutton>'\n    +'<button onclick=\"ctExportMD()\" style=\"flex:1;background:#1e293b;color:#fff;border:1px solid #334155;border-radius:10px;padding:11px;font-size:12px;font-weight:700\">⬇ Resumo .txt<\u002Fbutton><\u002Fdiv>'\n    +'<button onclick=\"ctCopyMD(this)\" style=\"width:100%;margin-top:8px;background:#fbbf24;color:#0f172a;border-radius:10px;padding:11px;font-size:12px;font-weight:700\">📋 Copiar resumo p/ Claude<\u002Fbutton>'\n    +'<\u002Fdiv>';\n\n  const names=ctChartNames(); let chartCard;\n  if(names.length){ const sel=(ctChartEx&&names.indexOf(ctChartEx)>=0)?ctChartEx:names[0];\n    const picker=names.map((nm,i)=>'<button onclick=\"ctSetChart('+i+')\" style=\"flex-shrink:0;font-size:11px;font-weight:600;border:1px solid '+(nm===sel?'#0f172a':'#e2e8f0')+';background:'+(nm===sel?'#0f172a':'#f8fafc')+';color:'+(nm===sel?'#fff':'#475569')+';border-radius:999px;padding:7px 13px;white-space:nowrap\">'+h(nm)+'<\u002Fbutton>').join('');\n    chartCard='<div class=\"card\"><h3>📈 Evolução de carga<\u002Fh3><div style=\"display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:6px\">'+picker+'<\u002Fdiv><div style=\"font-size:13px;font-weight:700;color:#1e293b;margin:2px 2px 4px\">'+h(sel)+'<\u002Fdiv>'+ctChartSVG(sel)+'<div style=\"font-size:10px;color:#94a3b8;text-align:center;margin-top:4px\">carga máxima da série principal · por treino<\u002Fdiv><\u002Fdiv>';\n  } else { chartCard='<div class=\"card\"><h3>📈 Evolução de carga<\u002Fh3><div style=\"text-align:center;padding:20px 10px;color:#94a3b8;font-size:12px;line-height:1.5\">Registre treinos e o gráfico de cada exercício aparece aqui.<\u002Fdiv><\u002Fdiv>'; }\n\n  let histHtml;\n  if(!ctData.history.length){ histHtml='<div style=\"background:#fff;border:1px dashed #cbd5e1;border-radius:16px;padding:28px 20px;text-align:center\"><div style=\"font-size:30px;margin-bottom:8px\">🗓️<\u002Fdiv><div style=\"font-size:13px;color:#64748b\">Seus treinos finalizados aparecem aqui.<\u002Fdiv><\u002Fdiv>'; }\n  else { histHtml=ctData.history.slice().reverse().map(w=>{ const m=CT_META[w.sessionId]||{em:'💪',short:'Treino',accent:'#0f172a'};\n    return '<button onclick=\"ctOpenDetail('+w.id+')\" style=\"width:100%;text-align:left;background:#fff;border:1px solid #f1f5f9;border-radius:14px;box-shadow:0 1px 2px rgba(0,0,0,.04);padding:13px 14px;margin-bottom:9px;display:flex;align-items:center;gap:12px;border-left:5px solid '+m.accent+'\"><span style=\"font-size:20px\">'+m.em+'<\u002Fspan><div style=\"flex:1;min-width:0\"><div style=\"font-size:14px;font-weight:700;color:#1e293b\">'+m.short+'<\u002Fdiv><div style=\"font-size:11px;color:#64748b;margin-top:2px\">'+ctFmtDate(w.dateMs)+' · '+w.setsDone+' séries · Sem '+w.week+'<\u002Fdiv><\u002Fdiv><div style=\"text-align:right\"><div style=\"font-size:13px;font-weight:800;color:#0f172a\">'+w.totalVolume+' kg<\u002Fdiv><div style=\"font-size:10px;color:#94a3b8\">'+w.durationMin+' min<\u002Fdiv><\u002Fdiv><\u002Fbutton>'; }).join(''); }\n\n  const todayLabel=today?(SESSIONS[today].day+' · '+CT_META[today].short+' recomendado'):'Descanso / futebol — treine o que quiser';\n  return sectionTitle('🏋️','Execução do Treino','Marque séries, cargas e descanso — tudo salvo no seu celular')\n    +'<div style=\"display:flex;align-items:flex-end;gap:8px;margin:2px 2px 12px\"><span style=\"font-size:20px\">📅<\u002Fspan><div><div style=\"font-size:15px;font-weight:700\">Treino de hoje<\u002Fdiv><div style=\"font-size:11px;color:#64748b;margin-top:2px\">'+todayLabel+'<\u002Fdiv><\u002Fdiv><\u002Fdiv>'\n    +cards\n    +'<div class=\"grid-3\" style=\"margin:14px 0\"><div class=\"stat\"><div class=\"v\">'+ctMonthCount()+'<\u002Fdiv><div class=\"l\">no mês<\u002Fdiv><\u002Fdiv><div class=\"stat\"><div class=\"v\">'+ctWeekCount()+'<\u002Fdiv><div class=\"l\">esta semana<\u002Fdiv><\u002Fdiv><div class=\"stat\"><div class=\"v\">'+ctData.history.length+'<\u002Fdiv><div class=\"l\">total<\u002Fdiv><\u002Fdiv><\u002Fdiv>'\n    +exportCard+chartCard\n    +'<div class=\"section-title\" style=\"margin:4px 0 10px\"><h2 style=\"font-size:14px\">Treinos registrados<\u002Fh2><\u002Fdiv>'\n    +histHtml;\n}\n\nfunction ctOpenDetail(id){ ctDetailId=id; render(); }\nfunction ctCloseDetail(){ ctDetailId=null; render(); }\nfunction ctRenderDetail(){\n  const w=ctData.history.find(x=>x.id===ctDetailId); if(!w) return ctRenderHome();\n  const m=CT_META[w.sessionId]||{em:'💪',short:'Treino'};\n  const exs=w.exercises.filter(e=>e.sets.some(s=>s.done)).map(e=>{\n    const chips=e.sets.filter(s=>s.done).map((s,i)=>'<span style=\"font-size:12px;font-weight:700;background:#f1f5f9;color:#334155;border-radius:8px;padding:5px 9px\">'+(i+1)+': '+(s.kg?s.kg+'kg':'PC')+'×'+(s.reps||'-')+'<\u002Fspan>').join('');\n    return '<div class=\"card\" style=\"padding:13px\"><div style=\"font-size:14px;font-weight:700;color:#1e293b\">'+h(e.name)+'<\u002Fdiv><div style=\"display:flex;flex-wrap:wrap;gap:6px;margin-top:9px\">'+chips+'<\u002Fdiv>'+(e.note?'<div class=\"box amber\" style=\"margin-top:9px\">✏️ '+h(e.note)+'<\u002Fdiv>':'')+'<\u002Fdiv>';\n  }).join('');\n  return '<button onclick=\"ctCloseDetail()\" style=\"background:none;color:#64748b;font-size:13px;font-weight:600;padding:4px 0;margin-bottom:10px\">← Voltar<\u002Fbutton>'\n    +'<div style=\"background:#0f172a;border-radius:16px;padding:16px;color:#fff;margin-bottom:14px\"><div style=\"font-size:17px;font-weight:800\">'+m.em+' '+m.short+'<\u002Fdiv><div style=\"font-size:12px;color:#94a3b8;margin-top:3px\">'+ctFmtDate(w.dateMs)+' · Semana '+w.week+'<\u002Fdiv><div style=\"display:flex;gap:18px;margin-top:12px\"><div><div style=\"font-size:18px;font-weight:800\">'+w.totalVolume+' kg<\u002Fdiv><div style=\"font-size:10px;color:#94a3b8\">volume<\u002Fdiv><\u002Fdiv><div><div style=\"font-size:18px;font-weight:800\">'+w.setsDone+'<\u002Fdiv><div style=\"font-size:10px;color:#94a3b8\">séries<\u002Fdiv><\u002Fdiv><div><div style=\"font-size:18px;font-weight:800\">'+w.durationMin+' min<\u002Fdiv><div style=\"font-size:10px;color:#94a3b8\">duração<\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv>'\n    +exs;\n}\n\n// ─── Render orchestration ───────────────────────────────────────────\nfunction render() {\n  document.getElementById('tabs').innerHTML = TABS.map(t =>\n    `<button class=\"tab ${STATE.tab===t.id?'active':''}\" data-act=\"setTab\" data-val=\"${t.id}\">\n      <span class=\"em\">${t.em}<\u002Fspan><span>${t.label}<\u002Fspan><\u002Fbutton>`).join('');\n  const fns = { analysis: renderAnalysis, diet: renderDiet, training: renderTraining, exec: renderExec, supps: renderSupps, lifestyle: renderLifestyle, tracking: renderTracking, history: renderHistory };\n  const fn = fns[STATE.tab] || renderAnalysis;\n  document.getElementById('content').innerHTML = fn();\n  window.scrollTo({ top: 0, behavior: 'instant' });\n}\n\n// ─── Event delegation ───────────────────────────────────────────────\ndocument.body.addEventListener('click', (e) => {\n  const btn = e.target.closest('[data-act]');\n  if (!btn) return;\n  const act = btn.dataset.act;\n  const val = btn.dataset.val;\n  if (act === 'setTab') { ctDetailId = null; set('tab', val); }\n  else if (act === 'setDayType') set('dayType', val);\n  else if (act === 'setWeek') set('week', parseInt(val, 10));\n  else if (act === 'setSession') set('session', val);\n});\n\n// ─── Install hint removed (não aplicável dentro do Claude) ───────────\n\n// ─── Init ───────────────────────────────────────────────────────────\nrender();\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
